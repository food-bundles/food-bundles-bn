tags:
  - name: Promo Code Management
    description: Promo code operations for discounts and promotions

components:
  schemas:
    PromoCode:
      type: object
      properties:
        id:
          type: string
          example: "promo_123456"
        code:
          type: string
          example: "SAVE20"
        name:
          type: string
          example: "20% Off Summer Sale"
        description:
          type: string
          example: "Get 20% off on all orders above 10,000 RWF"
        type:
          type: string
          enum: [PUBLIC, SUBSCRIBERS, EXCEPTIONAL]
          example: "PUBLIC"
        discountType:
          type: string
          enum: [PERCENTAGE, FIXED_AMOUNT]
          example: "PERCENTAGE"
        discountValue:
          type: number
          example: 20
        isReusable:
          type: boolean
          example: true
        maxUsageCount:
          type: integer
          example: 1000
        currentUsageCount:
          type: integer
          example: 45
        maxUsagePerUser:
          type: integer
          example: 3
        minOrderAmount:
          type: number
          example: 10000
        minItemQuantity:
          type: integer
          example: 2
        applyToAllProducts:
          type: boolean
          example: true
        applicableProductIds:
          type: array
          items:
            type: string
          example: ["prod_1", "prod_2"]
        applicableCategoryIds:
          type: array
          items:
            type: string
          example: ["cat_1", "cat_2"]
        isActive:
          type: boolean
          example: true
        startDate:
          type: string
          format: date-time
          example: "2024-12-01T00:00:00Z"
        expiryDate:
          type: string
          format: date-time
          example: "2024-12-31T23:59:59Z"
        usageHistory:
          type: array
          items:
            type: object
            properties:
              restaurantId:
                type: string
              orderId:
                type: string
              originalAmount:
                type: number
              discountAmount:
                type: number
              finalAmount:
                type: number
              itemsDiscounted:
                type: integer
              usedAt:
                type: string
                format: date-time
        excludedRestaurants:
          type: array
          items:
            type: object
            properties:
              restaurantId:
                type: string
              reason:
                type: string
              excludedBy:
                type: string
              excludedAt:
                type: string
                format: date-time
        includedRestaurants:
          type: array
          items:
            type: object
            properties:
              restaurantId:
                type: string
              reason:
                type: string
              includedBy:
                type: string
              includedAt:
                type: string
                format: date-time
          description: List of restaurants specifically included for private promo codes
        restaurantUsageCount:
          type: object
          example: { "rest_1": 2, "rest_2": 1 }
        createdBy:
          type: string
          example: "admin_123"
        createdAt:
          type: string
          format: date-time
          example: "2024-12-01T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-12-01T10:00:00Z"
        admin:
          type: object
          properties:
            id:
              type: string
            username:
              type: string
            email:
              type: string

    CreatePromoCodeRequest:
      type: object
      required:
        - code
        - name
        - type
        - discountType
        - discountValue
      properties:
        code:
          type: string
          example: "SAVE20"
        name:
          type: string
          example: "20% Off Summer Sale"
        description:
          type: string
          example: "Get 20% off on all orders above 10,000 RWF"
        type:
          type: string
          enum: [PUBLIC, SUBSCRIBERS, EXCEPTIONAL]
          example: "PUBLIC"
        discountType:
          type: string
          enum: [PERCENTAGE, FIXED_AMOUNT]
          example: "PERCENTAGE"
        discountValue:
          type: number
          example: 20
        isReusable:
          type: boolean
          example: true
        maxUsageCount:
          type: integer
          example: 1000
        maxUsagePerUser:
          type: integer
          example: 3
        minOrderAmount:
          type: number
          example: 10000
        minItemQuantity:
          type: integer
          example: 2
        applyToAllProducts:
          type: boolean
          example: true
        applicableProductIds:
          type: array
          items:
            type: string
          example: ["prod_1", "prod_2"]
        applicableCategoryIds:
          type: array
          items:
            type: string
          example: ["cat_1", "cat_2"]
        startDate:
          type: string
          format: date-time
          example: "2024-12-01T00:00:00Z"
        expiryDate:
          type: string
          format: date-time
          example: "2024-12-31T23:59:59Z"
        excludedRestaurants:
          type: array
          items:
            type: object
            properties:
              restaurantId:
                type: string
                example: "restaurant_123"
              reason:
                type: string
                example: "Previous violation of terms"
          description: List of restaurants to exclude from this promo code
        includedRestaurants:
          type: array
          items:
            type: object
            properties:
              restaurantId:
                type: string
                example: "restaurant_456"
              reason:
                type: string
                example: "VIP customer - private promo"
          description: List of restaurants to specifically include for private promo codes

    ValidatePromoCodeRequest:
      type: object
      required:
        - orderAmount
      properties:
        orderAmount:
          type: number
          example: 15000

    ApplyPromoCodeRequest:
      type: object
      required:
        - orderId
        - items
      properties:
        orderId:
          type: string
          example: "order_123456"
        items:
          type: array
          items:
            type: object
            required:
              - productId
              - quantity
            properties:
              productId:
                type: string
                example: "prod_123456"
              quantity:
                type: integer
                example: 2
          example:
            - productId: "prod_123456"
              quantity: 2
            - productId: "prod_789012"
              quantity: 1

    IncludeRestaurantRequest:
      type: object
      required:
        - restaurantId
        - reason
      properties:
        restaurantId:
          type: string
          example: "rest_123456"
        reason:
          type: string
          example: "VIP customer - exclusive access"

    PromoCodeResponse:
      type: object
      properties:
        message:
          type: string
          example: "Promo code created successfully"
        data:
          $ref: "#/components/schemas/PromoCode"

    PromoCodeListResponse:
      type: object
      properties:
        message:
          type: string
          example: "Promo codes retrieved successfully"
        data:
          type: array
          items:
            $ref: "#/components/schemas/PromoCode"
        count:
          type: integer
          example: 10

    ValidatePromoCodeResponse:
      type: object
      properties:
        message:
          type: string
          example: "Promo code is valid"
        data:
          type: object
          properties:
            promoCode:
              type: object
              properties:
                id:
                  type: string
                code:
                  type: string
                name:
                  type: string
                description:
                  type: string
                discountType:
                  type: string
                discountValue:
                  type: number
            discount:
              type: object
              properties:
                originalAmount:
                  type: number
                discountAmount:
                  type: number
                finalAmount:
                  type: number
                savings:
                  type: number

    ApplyPromoCodeResponse:
      type: object
      properties:
        message:
          type: string
          example: "Promo code applied successfully"
        data:
          type: object
          properties:
            promoCode:
              $ref: "#/components/schemas/PromoCode"
            originalAmount:
              type: number
              example: 15000
            discountAmount:
              type: number
              example: 3000
            finalAmount:
              type: number
              example: 12000
            discountPercentage:
              type: number
              example: 20
            discountedItems:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  productId:
                    type: string
                  quantity:
                    type: integer
                  price:
                    type: number
                  originalPrice:
                    type: number
                  discountAmount:
                    type: number
                  discountedPrice:
                    type: number
                  finalItemTotal:
                    type: number
            applicableItemsCount:
              type: integer
              example: 2

    PublicPromoCode:
      type: object
      properties:
        id:
          type: string
          example: "promo_123456"
        code:
          type: string
          example: "SAVE20"
        name:
          type: string
          example: "20% Off Everything"
        description:
          type: string
          example: "Get 20% off on all products"
        type:
          type: string
          enum: [GENERAL, SUBSCRIBERS, EXCEPTIONAL]
          example: "GENERAL"
        discountType:
          type: string
          enum: [PERCENTAGE, FIXED_AMOUNT]
          example: "PERCENTAGE"
        discountValue:
          type: number
          example: 20
        minOrderAmount:
          type: number
          nullable: true
          example: 50000
        minItemQuantity:
          type: integer
          nullable: true
          example: 2
        expiryDate:
          type: string
          format: date-time
          nullable: true
          example: "2024-12-31T23:59:59Z"
        maxUsageCount:
          type: integer
          nullable: true
          example: 1000
        currentUsageCount:
          type: integer
          example: 250

    RestaurantPromoCode:
      allOf:
        - $ref: "#/components/schemas/PublicPromoCode"
        - type: object
          properties:
            myUsageCount:
              type: integer
              description: Number of times this restaurant has used this promo
              example: 3

    CartCalculation:
      type: object
      properties:
        cartId:
          type: string
          example: "cart_123456"
        originalAmount:
          type: number
          example: 75000
        promoCode:
          type: object
          properties:
            code:
              type: string
              example: "SAVE20"
            name:
              type: string
              example: "20% Off Everything"
            discountType:
              type: string
              example: "PERCENTAGE"
            discountValue:
              type: number
              example: 20
        discountAmount:
          type: number
          example: 15000
        finalAmount:
          type: number
          example: 60000
        discountPercentage:
          type: number
          example: 20
        savings:
          type: number
          example: 15000

paths:
  /promo/active:
    get:
      tags:
        - Promo Code Management
      summary: Get all active promo codes
      description: Public endpoint to view all currently active promo codes without authentication
      responses:
        "200":
          description: List of active promo codes retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicPromoCode"
        "500":
          description: Internal server error

  /promo/my-promos:
    get:
      tags:
        - Promo Code Management
      summary: Get my available promo codes
      description: Get promo codes available for the authenticated restaurant
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Restaurant's available promo codes retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RestaurantPromoCode"
        "401":
          description: Unauthorized - Restaurant authentication required
        "500":
          description: Internal server error

  /promo/calculate-cart:
    post:
      tags:
        - Promo Code Management
      summary: Calculate cart total with promo code
      description: Show updated price for a cart when applying a promo code
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cartId
                - promoCode
              properties:
                cartId:
                  type: string
                  description: ID of the cart to calculate
                  example: "cart_123456"
                promoCode:
                  type: string
                  description: Promo code to apply
                  example: "SAVE20"
      responses:
        "200":
          description: Cart calculation with promo code successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/CartCalculation"
        "400":
          description: Bad request - Invalid cart ID or promo code
        "401":
          description: Unauthorized - Restaurant authentication required

  /promo:
    post:
      tags:
        - Promo Code Management
      summary: Create a new promo code (Admin only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePromoCodeRequest"
      responses:
        201:
          description: Promo code created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoCodeResponse"
        400:
          description: Bad request - validation error
        401:
          description: Unauthorized - admin access required

    get:
      tags:
        - Promo Code Management
      summary: Get all promo codes (Admin only)
      security:
        - BearerAuth: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [PUBLIC, SUBSCRIBERS, EXCEPTIONAL]
          description: Filter by promo code type
        - name: isActive
          in: query
          schema:
            type: boolean
          description: Filter by active status
        - name: search
          in: query
          schema:
            type: string
          description: Search by code or name
      responses:
        200:
          description: Promo codes retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoCodeListResponse"
        401:
          description: Unauthorized - admin access required

  /promo/{id}:
    get:
      tags:
        - Promo Code Management (Admin only)
      summary: Get promo code by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Promo code ID
      responses:
        200:
          description: Promo code retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoCodeResponse"
        404:
          description: Promo code not found
        401:
          description: Unauthorized - admin access required

    put:
      tags:
        - Promo Code Management
      summary: Update promo code (Admin only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Promo code ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePromoCodeRequest"
      responses:
        200:
          description: Promo code updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoCodeResponse"
        400:
          description: Bad request - validation error
        404:
          description: Promo code not found
        401:
          description: Unauthorized - admin access required

    delete:
      tags:
        - Promo Code Management
      summary: Delete promo code (Admin only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Promo code ID
      responses:
        200:
          description: Promo code deleted successfully
        404:
          description: Promo code not found
        401:
          description: Unauthorized - admin access required

  /promo/code/{code}:
    get:
      tags:
        - Promo Code Management
      summary: Get promo code by code (Restaurant only)
      security:
        - BearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: Promo code
      responses:
        200:
          description: Promo code retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoCodeResponse"
        404:
          description: Promo code not found
        401:
          description: Unauthorized - restaurant access required

  /promo/validate/{code}:
    post:
      tags:
        - Promo Code Management
      summary: Validate promo code for order (Restaurant only)
      security:
        - BearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: Promo code to validate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidatePromoCodeRequest"
      responses:
        200:
          description: Promo code is valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidatePromoCodeResponse"
        400:
          description: Invalid promo code or validation failed
        401:
          description: Unauthorized - restaurant access required

  /promo/apply/{code}:
    post:
      tags:
        - Promo Code Management
      summary: Apply promo code to order (Restaurant only)
      security:
        - BearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: Promo code to apply
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyPromoCodeRequest"
      responses:
        200:
          description: Promo code applied successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyPromoCodeResponse"
        400:
          description: Failed to apply promo code
        401:
          description: Unauthorized - restaurant access required

  /promo/{id}/exclude:
    post:
      tags:
        - Promo Code Management
      summary: Exclude restaurant from promo code (Admin only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Promo code ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExcludeRestaurantRequest"
      responses:
        200:
          description: Restaurant excluded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoCodeResponse"
        400:
          description: Bad request
        401:
          description: Unauthorized - admin access required

  /promo/{id}/include:
    post:
      tags:
        - Promo Code Management
      summary: Include restaurant in promo code (Admin only)
      description: Add a restaurant to the inclusion list for private promo code access
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Promo code ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncludeRestaurantRequest"
      responses:
        200:
          description: Restaurant included successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoCodeResponse"
        400:
          description: Bad request
        401:
          description: Unauthorized - admin access required

  /promo/{id}/include/{restaurantId}:
    delete:
      tags:
        - Promo Code Management
      summary: Remove restaurant inclusion from promo code (Admin only)
      description: Remove a restaurant from the inclusion list
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Promo code ID
        - name: restaurantId
          in: path
          required: true
          schema:
            type: string
          description: Restaurant ID to remove from inclusions
      responses:
        200:
          description: Restaurant inclusion removed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoCodeResponse"
        400:
          description: Bad request
        401:
          description: Unauthorized - admin access required
