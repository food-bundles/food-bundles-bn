tags:
  - name: Statistics API Management
    description: Dashboard statistics and analytics operations

components:
  schemas:
    DashboardStatsResponse:
      type: object
      properties:
        message:
          type: string
          example: "Dashboard statistics retrieved successfully"
        data:
          $ref: "#/components/schemas/DashboardStats"

    DashboardStats:
      type: object
      properties:
        users:
          $ref: "#/components/schemas/UserStats"
        orders:
          $ref: "#/components/schemas/OrderStats"
        finance:
          $ref: "#/components/schemas/FinanceStats"
        subscriptions:
          $ref: "#/components/schemas/SubscriptionStats"
        vouchers:
          $ref: "#/components/schemas/VoucherStats"
        quickStats:
          $ref: "#/components/schemas/QuickStats"
        recentActivities:
          type: array
          items:
            $ref: "#/components/schemas/RecentActivity"
        systemStatus:
          $ref: "#/components/schemas/SystemStatus"
        filters:
          $ref: "#/components/schemas/StatsFilters"

    UserStats:
      type: object
      properties:
        totalUsers:
          type: integer
          example: 1250
        restaurants:
          type: integer
          example: 340
        farmers:
          type: integer
          example: 850
        admins:
          type: integer
          example: 60
        affiliators:
          type: integer
          example: 45
        logistics:
          type: integer
          example: 15
        timeSeriesData:
          type: array
          items:
            type: object
            properties:
              period:
                type: string
                example: "Dec 1"
              date:
                type: string
                example: "2024-12-01"
              restaurants:
                type: integer
                example: 5
              farmers:
                type: integer
                example: 12
              admins:
                type: integer
                example: 1
              affiliators:
                type: integer
                example: 2
              total:
                type: integer
                example: 20
        growth:
          type: object
          properties:
            totalChange:
              type: number
              example: 12.5
            restaurantChange:
              type: number
              example: 8.2
            farmerChange:
              type: number
              example: 15.3
            adminChange:
              type: number
              example: 3.4

    OrderStats:
      type: object
      properties:
        totalOrders:
          type: integer
          example: 2840
        completedOrders:
          type: integer
          example: 2156
        cancelledOrders:
          type: integer
          example: 284
        ongoingOrders:
          type: integer
          example: 400
        timeSeriesData:
          type: array
          items:
            type: object
            properties:
              period:
                type: string
                example: "Dec 1"
              date:
                type: string
                example: "2024-12-01"
              completed:
                type: integer
                example: 58
              cancelled:
                type: integer
                example: 5
              ongoing:
                type: integer
                example: 22
              total:
                type: integer
                example: 85
        growth:
          type: object
          properties:
            totalChange:
              type: number
              example: 8.2
            completedChange:
              type: number
              example: 15.3

    FinanceStats:
      type: object
      properties:
        totalRevenue:
          type: number
          example: 45600000
        totalExpenses:
          type: number
          example: 12300000
        netProfit:
          type: number
          example: 33300000
        profitMargin:
          type: number
          example: 77.9
        timeSeriesData:
          type: array
          items:
            type: object
            properties:
              period:
                type: string
                example: "Dec 1"
              date:
                type: string
                example: "2024-12-01"
              month:
                type: integer
                example: 12
              revenue:
                type: number
                example: 4800000
              expenses:
                type: number
                example: 1200000
        revenueBreakdown:
          type: object
          properties:
            orders:
              type: number
              example: 38000000
            subscriptions:
              type: number
              example: 5600000
            vouchers:
              type: number
              example: 2000000
        expenseBreakdown:
          type: object
          properties:
            usedVouchers:
              type: number
              example: 8000000
            maturedVouchers:
              type: number
              example: 2000000
            nearMaturityVouchers:
              type: number
              example: 500000
            farmerPayments:
              type: number
              example: 1800000

    SubscriptionStats:
      type: object
      properties:
        totalSubscriptions:
          type: integer
          example: 220
        activeSubscriptions:
          type: integer
          example: 180
        expiredSubscriptions:
          type: integer
          example: 40
        planBreakdown:
          type: array
          items:
            type: object
            properties:
              planName:
                type: string
                example: "Premium Plan"
              count:
                type: integer
                example: 85
              revenue:
                type: number
                example: 2550000
        growth:
          type: object
          properties:
            totalChange:
              type: number
              example: 5.7
            activeChange:
              type: number
              example: -2.1

    VoucherStats:
      type: object
      properties:
        totalVouchers:
          type: integer
          example: 450
        usedVouchers:
          type: integer
          example: 320
        maturedVouchers:
          type: integer
          example: 130
        nearMaturityVouchers:
          type: integer
          example: 25
        totalValue:
          type: number
          example: 15000000
        usedValue:
          type: number
          example: 12000000
        timeSeriesData:
          type: array
          items:
            type: object
            properties:
              period:
                type: string
                example: "Dec 1"
              date:
                type: string
                example: "2024-12-01"
              total:
                type: integer
                example: 15
              used:
                type: integer
                example: 12
              matured:
                type: integer
                example: 3
              totalValue:
                type: number
                example: 500000
              usedValue:
                type: number
                example: 400000
        growth:
          type: object
          properties:
            totalChange:
              type: number
              example: -2.1
            usedChange:
              type: number
              example: 3.4

    QuickStats:
      type: object
      properties:
        totalUsers:
          type: object
          properties:
            value:
              type: integer
              example: 1250
            change:
              type: number
              example: 12.5
        totalOrders:
          type: object
          properties:
            value:
              type: integer
              example: 2840
            change:
              type: number
              example: 8.2
        totalRevenue:
          type: object
          properties:
            value:
              type: number
              example: 45600000
            change:
              type: number
              example: 15.3
        activeSubscriptions:
          type: object
          properties:
            value:
              type: integer
              example: 180
            change:
              type: number
              example: 5.7
        usedVouchers:
          type: object
          properties:
            value:
              type: integer
              example: 320
            change:
              type: number
              example: -2.1
        completionRate:
          type: object
          properties:
            value:
              type: number
              example: 75.9
            change:
              type: number
              example: 3.4

    RecentActivity:
      type: object
      properties:
        id:
          type: string
          example: "ord_123456"
        type:
          type: string
          enum: [order, voucher, subscription, user]
          example: "order"
        title:
          type: string
          example: "New Order Placed"
        description:
          type: string
          example: "Order #ORD20241201001 - Green Valley Restaurant"
        status:
          type: string
          example: "pending"
        timestamp:
          type: string
          format: date-time
          example: "2024-12-01T11:28:13Z"
        metadata:
          type: object
          example:
            amount: 125000
            currency: "RWF"

    SystemStatus:
      type: object
      properties:
        overallStatus:
          type: string
          enum: [Operational, Degraded, Down]
          example: "Operational"
        uptime:
          type: number
          example: 99.9
        avgResponseTime:
          type: integer
          example: 275
        services:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: "API Gateway"
              status:
                type: string
                enum: [Operational, Degraded, Down]
                example: "Operational"
              responseTime:
                type: integer
                example: 185
              lastChecked:
                type: string
                format: date-time
                example: "2024-12-01T11:35:14Z"
        systemMetrics:
          type: object
          properties:
            cpu:
              type: object
              properties:
                cores:
                  type: integer
                  example: 8
                usagePercent:
                  type: integer
                  example: 45
                loadAverage:
                  type: array
                  items:
                    type: number
                  example: [1.2, 1.5, 1.8]
            memory:
              type: object
              properties:
                total:
                  type: integer
                  example: 16
                used:
                  type: integer
                  example: 8
                free:
                  type: integer
                  example: 8
                usagePercent:
                  type: integer
                  example: 50
            uptime:
              type: object
              properties:
                seconds:
                  type: integer
                  example: 86400
                formatted:
                  type: string
                  example: "1d 0h"
            platform:
              type: object
              properties:
                os:
                  type: string
                  example: "linux"
                arch:
                  type: string
                  example: "x64"
                hostname:
                  type: string
                  example: "foodbundles-server"

    StatsFilters:
      type: object
      properties:
        period:
          type: string
          enum: [lifetime, year, month, week, today]
          example: "lifetime"
        year:
          type: integer
          example: 2024
        month:
          type: integer
          example: 12
        dateFrom:
          type: string
          format: date-time
          example: "2024-12-01T00:00:00Z"
        dateTo:
          type: string
          format: date-time
          example: "2024-12-31T23:59:59Z"

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: "Failed to retrieve dashboard statistics"

security:
  - BearerAuth: []

paths:
  /stats/dashboard:
    get:
      tags:
        - Statistics API Management
      summary: Get comprehensive dashboard statistics
      description: Retrieve all dashboard statistics including users, orders, finance, subscriptions, vouchers, quick stats, recent activities, and system status
      security:
        - BearerAuth: []
      parameters:
        - name: period
          in: query
          description: Time period filter
          required: false
          schema:
            type: string
            enum: [lifetime, year, month, week, today]
            example: "lifetime"
        - name: year
          in: query
          description: Year filter (optional)
          required: false
          schema:
            type: integer
            minimum: 2020
            maximum: 2030
            example: 2024
        - name: month
          in: query
          description: Month filter (1-12, optional)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 12
            example: 12
      responses:
        200:
          description: Dashboard statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStatsResponse"
        400:
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        401:
          description: Unauthorized - Invalid or missing token
        403:
          description: Forbidden - Admin access required
        500:
          description: Internal server error

  /stats/users:
    get:
      tags:
        - Statistics API Management
      summary: Get user statistics
      description: Retrieve user statistics with growth metrics and role breakdown
      security:
        - BearerAuth: []
      parameters:
        - name: period
          in: query
          description: Time period filter
          required: false
          schema:
            type: string
            enum: [lifetime, year, month, week, today]
            example: "lifetime"
        - name: year
          in: query
          schema:
            type: integer
            example: 2024
        - name: month
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
            example: 12
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
            example: "2024-12-01"
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
            example: "2024-12-31"
      responses:
        200:
          description: User statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User statistics retrieved successfully"
                  data:
                    $ref: "#/components/schemas/UserStats"
                  filters:
                    $ref: "#/components/schemas/StatsFilters"
        401:
          description: Unauthorized
        403:
          description: Forbidden - Admin access required
        500:
          description: Internal server error

  /stats/orders:
    get:
      tags:
        - Statistics API Management
      summary: Get order statistics
      description: Retrieve order statistics with daily breakdown and growth metrics
      security:
        - BearerAuth: []
      parameters:
        - name: year
          in: query
          schema:
            type: integer
            example: 2024
        - name: month
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
            example: 12
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
            example: "2024-12-01"
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
            example: "2024-12-31"
      responses:
        200:
          description: Order statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Order statistics retrieved successfully"
                  data:
                    $ref: "#/components/schemas/OrderStats"
                  filters:
                    $ref: "#/components/schemas/StatsFilters"
        401:
          description: Unauthorized
        403:
          description: Forbidden - Admin access required
        500:
          description: Internal server error

  /stats/finance:
    get:
      tags:
        - Statistics API Management
      summary: Get financial statistics
      description: Retrieve financial statistics with revenue vs expenses breakdown and monthly data
      security:
        - BearerAuth: []
      parameters:
        - name: year
          in: query
          schema:
            type: integer
            example: 2024
        - name: month
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
            example: 12
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
            example: "2024-12-01"
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
            example: "2024-12-31"
      responses:
        200:
          description: Finance statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Finance statistics retrieved successfully"
                  data:
                    $ref: "#/components/schemas/FinanceStats"
                  filters:
                    $ref: "#/components/schemas/StatsFilters"
        401:
          description: Unauthorized
        403:
          description: Forbidden - Admin access required
        500:
          description: Internal server error

  /stats/subscriptions:
    get:
      tags:
        - Statistics API Management
      summary: Get subscription statistics
      description: Retrieve subscription statistics with plan breakdown and growth metrics
      security:
        - BearerAuth: []
      parameters:
        - name: year
          in: query
          schema:
            type: integer
            example: 2024
        - name: month
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
            example: 12
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
            example: "2024-12-01"
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
            example: "2024-12-31"
      responses:
        200:
          description: Subscription statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Subscription statistics retrieved successfully"
                  data:
                    $ref: "#/components/schemas/SubscriptionStats"
                  filters:
                    $ref: "#/components/schemas/StatsFilters"
        401:
          description: Unauthorized
        403:
          description: Forbidden - Admin access required
        500:
          description: Internal server error

  /stats/vouchers:
    get:
      tags:
        - Statistics API Management
      summary: Get voucher statistics
      description: Retrieve voucher statistics with usage metrics and growth data
      security:
        - BearerAuth: []
      parameters:
        - name: year
          in: query
          schema:
            type: integer
            example: 2024
        - name: month
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
            example: 12
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
            example: "2024-12-01"
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
            example: "2024-12-31"
      responses:
        200:
          description: Voucher statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Voucher statistics retrieved successfully"
                  data:
                    $ref: "#/components/schemas/VoucherStats"
                  filters:
                    $ref: "#/components/schemas/StatsFilters"
        401:
          description: Unauthorized
        403:
          description: Forbidden - Admin access required
        500:
          description: Internal server error

  /stats/quick:
    get:
      tags:
        - Statistics API Management
      summary: Get quick statistics
      description: Retrieve quick statistics for dashboard cards with percentage changes
      security:
        - BearerAuth: []
      parameters:
        - name: year
          in: query
          schema:
            type: integer
            example: 2024
        - name: month
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
            example: 12
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
            example: "2024-12-01"
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
            example: "2024-12-31"
      responses:
        200:
          description: Quick statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Quick statistics retrieved successfully"
                  data:
                    $ref: "#/components/schemas/QuickStats"
                  filters:
                    $ref: "#/components/schemas/StatsFilters"
        401:
          description: Unauthorized
        403:
          description: Forbidden - Admin access required
        500:
          description: Internal server error

  /stats/activities:
    get:
      tags:
        - Statistics API Management
      summary: Get recent activities
      description: Retrieve the 10 most recent system activities across all sections
      security:
        - BearerAuth: []
      responses:
        200:
          description: Recent activities retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Recent activities retrieved successfully"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecentActivity"
        401:
          description: Unauthorized
        403:
          description: Forbidden - Admin access required
        500:
          description: Internal server error

  /stats/system-status:
    get:
      tags:
        - Statistics API Management
      summary: Get system status
      description: Retrieve system health status including API, database, WebSocket, and external services
      security:
        - BearerAuth: []
      responses:
        200:
          description: System status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "System status retrieved successfully"
                  data:
                    $ref: "#/components/schemas/SystemStatus"
        401:
          description: Unauthorized
        403:
          description: Forbidden - Admin access required
        500:
          description: Internal server error
