tags:
  - name: Statistics API Management
    description: Dashboard statistics and analytics operations

components:
  schemas:
    # Main Dashboard Stats Response
    DashboardStatsResponse:
      type: object
      properties:
        message:
          type: string
          example: "Dashboard statistics retrieved successfully"
        data:
          $ref: "#/components/schemas/DashboardStats"

    DashboardStats:
      type: object
      properties:
        users:
          $ref: "#/components/schemas/UserStats"
        orders:
          $ref: "#/components/schemas/OrderStats"
        finance:
          $ref: "#/components/schemas/FinanceStats"
        subscriptions:
          $ref: "#/components/schemas/SubscriptionStats"
        vouchers:
          $ref: "#/components/schemas/VoucherStats"
        quickStats:
          $ref: "#/components/schemas/QuickStats"
        recentActivities:
          type: array
          items:
            $ref: "#/components/schemas/RecentActivity"
        systemStatus:
          $ref: "#/components/schemas/SystemStatus"
        filters:
          $ref: "#/components/schemas/StatsFilters"

    # User Statistics Schema
    UserStats:
      type: object
      properties:
        totalUsers:
          type: integer
          description: Total number of users across all roles
          example: 1250
        restaurants:
          type: integer
          description: Number of restaurant users
          example: 340
        farmers:
          type: integer
          description: Number of farmer users
          example: 850
        admins:
          type: integer
          description: Number of admin users
          example: 60
        affiliators:
          type: integer
          description: Number of affiliator users
          example: 45
        logistics:
          type: integer
          description: Number of logistics users
          example: 15
        growth:
          type: object
          properties:
            totalChange:
              type: number
              description: Percentage change in total users
              example: 12.5
            restaurantChange:
              type: number
              description: Percentage change in restaurant users
              example: 8.2
            farmerChange:
              type: number
              description: Percentage change in farmer users
              example: 15.3
            adminChange:
              type: number
              description: Percentage change in admin users
              example: 3.4
No token found
    # Order Statistics Schema
    OrderStats:
      type: object
      properties:
        totalOrders:
          type: integer
          description: Total number of orders
          example: 2840
        completedOrders:
          type: integer
          description: Number of completed orders
          example: 2156
        cancelledOrders:
          type: integer
          description: Number of cancelled orders
          example: 284
        ongoingOrders:
          type: integer
          description: Number of ongoing orders (confirmed, preparing, ready, in-transit)
          example: 400
        dailyOrders:
          type: array
          description: Daily order breakdown for the last 30 days
          items:
            type: object
            properties:
              date:
                type: string
                format: date
                example: "2024-12-01"
              completed:
                type: integer
                example: 58
              cancelled:
                type: integer
                example: 5
              ongoing:
                type: integer
                example: 22
        growth:
          type: object
          properties:
            totalChange:
              type: number
              description: Percentage change in total orders
              example: 8.2
            completedChange:
              type: number
              description: Percentage change in completed orders
              example: 15.3

    # Finance Statistics Schema
    FinanceStats:
      type: object
      properties:
        totalRevenue:
          type: number
          description: Total revenue in RWF
          example: 45600000
        totalExpenses:
          type: number
          description: Total expenses in RWF
          example: 12300000
        netProfit:
          type: number
          description: Net profit (revenue - expenses) in RWF
          example: 33300000
        profitMargin:
          type: number
          description: Profit margin percentage
          example: 77.9
        monthlyFinance:
          type: array
          description: Monthly revenue vs expenses for the last 12 months
          items:
            type: object
            properties:
              month:
                type: string
                example: "Jan"
              revenue:
                type: number
                example: 4800000
              expenses:
                type: number
                example: 1200000
        revenueBreakdown:
          type: object
          properties:
            orders:
              type: number
              description: Revenue from completed orders
              example: 38000000
            subscriptions:
              type: number
              description: Revenue from subscription payments
              example: 5600000
            vouchers:
              type: number
              description: Revenue from voucher repayments
              example: 2000000
        expenseBreakdown:
          type: object
          properties:
            usedVouchers:
              type: number
              description: Expenses from used vouchers
              example: 8000000
            maturedVouchers:
              type: number
              description: Expenses from matured vouchers
              example: 2000000
            nearMaturityVouchers:
              type: number
              description: Expenses from near-maturity vouchers (1-2 days remaining)
              example: 500000
            farmerPayments:
              type: number
              description: Payments made to farmers for supplies
              example: 1800000

    # Subscription Statistics Schema
    SubscriptionStats:
      type: object
      properties:
        totalSubscriptions:
          type: integer
          description: Total number of subscriptions created
          example: 220
        activeSubscriptions:
          type: integer
          description: Number of active subscriptions
          example: 180
        expiredSubscriptions:
          type: integer
          description: Number of expired subscriptions
          example: 40
        planBreakdown:
          type: array
          description: Breakdown by subscription plan
          items:
            type: object
            properties:
              planName:
                type: string
                example: "Premium Plan"
              count:
                type: integer
                example: 85
              revenue:
                type: number
                example: 2550000
        growth:
          type: object
          properties:
            totalChange:
              type: number
              description: Percentage change in total subscriptions
              example: 5.7
            activeChange:
              type: number
              description: Percentage change in active subscriptions
              example: -2.1

    # Voucher Statistics Schema
    VoucherStats:
      type: object
      properties:
        totalVouchers:
          type: integer
          description: Total number of vouchers (used + matured)
          example: 450
        usedVouchers:
          type: integer
          description: Number of used vouchers
          example: 320
        maturedVouchers:
          type: integer
          description: Number of matured vouchers
          example: 130
        nearMaturityVouchers:
          type: integer
          description: Number of vouchers near maturity (1-2 payment days remaining)
          example: 25
        totalValue:
          type: number
          description: Total value of all vouchers
          example: 15000000
        usedValue:
          type: number
          description: Total value of used vouchers
          example: 12000000
        growth:
          type: object
          properties:
            totalChange:
              type: number
              description: Percentage change in total vouchers
              example: -2.1
            usedChange:
              type: number
              description: Percentage change in used vouchers
              example: 3.4

    # Quick Statistics Schema
    QuickStats:
      type: object
      properties:
        totalUsers:
          type: object
          properties:
            value:
              type: integer
              example: 1250
            change:
              type: number
              description: Percentage change from previous period
              example: 12.5
        totalOrders:
          type: object
          properties:
            value:
              type: integer
              example: 2840
            change:
              type: number
              example: 8.2
        totalRevenue:
          type: object
          properties:
            value:
              type: number
              example: 45600000
            change:
              type: number
              example: 15.3
        activeSubscriptions:
          type: object
          properties:
            value:
              type: integer
              example: 180
            change:
              type: number
              example: 5.7
        usedVouchers:
          type: object
          properties:
            value:
              type: integer
              example: 320
            change:
              type: number
              example: -2.1
        completionRate:
          type: object
          properties:
            value:
              type: number
              description: Order completion rate percentage
              example: 75.9
            change:
              type: number
              example: 3.4

    # Recent Activity Schema
    RecentActivity:
      type: object
      properties:
        id:
          type: string
          example: "ord_123456"
        type:
          type: string
          enum: [order, voucher, subscription, user]
          example: "order"
        title:
          type: string
          example: "New Order Placed"
        description:
          type: string
          example: "Order #ORD20241201001 - Green Valley Restaurant"
        status:
          type: string
          example: "pending"
        timestamp:
          type: string
          format: date-time
          example: "2024-12-01T11:28:13Z"
        metadata:
          type: object
          description: Additional activity-specific data
          example:
            amount: 125000
            currency: "RWF"

    # System Status Schema
    SystemStatus:
      type: object
      properties:
        overallStatus:
          type: string
          enum: [Operational, Degraded, Down]
          example: "Operational"
        uptime:
          type: number
          description: System uptime percentage
          example: 99.9
        avgResponseTime:
          type: integer
          description: Average response time in milliseconds
          example: 275
        services:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: "API Gateway"
              status:
                type: string
                enum: [Operational, Degraded, Down]
                example: "Operational"
              responseTime:
                type: integer
                description: Service response time in milliseconds
                example: 185
              lastChecked:
                type: string
                format: date-time
                example: "2024-12-01T11:35:14Z"

    # Stats Filters Schema
    StatsFilters:
      type: object
      properties:
        year:
          type: integer
          description: Year filter applied
          example: 2024
        month:
          type: integer
          description: Month filter applied (1-12)
          example: 12
        dateFrom:
          type: string
          format: date-time
          description: Start date of the filtered period
          example: "2024-12-01T00:00:00Z"
        dateTo:
          type: string
          format: date-time
          description: End date of the filtered period
          example: "2024-12-31T23:59:59Z"

    # Error Response Schema
    StatsErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: "Failed to retrieve dashboard statistics"

paths:
  /stats/dashboard:
    get:
      tags:
        - Statistics API Management
      summary: Get comprehensive dashboard statistics
      description: Retrieve all dashboard statistics including users, orders, finance, subscriptions, vouchers, quick stats, recent activities, and system status
      security:
        - BearerAuth: []
      parameters:
        - name: year
          in: query
          description: Year filter (defaults to current year)
          required: false
          schema:
            type: integer
            minimum: 2020
            maximum: 2030
            example: 2024
        - name: month
          in: query
          description: Month filter (1-12, optional)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 12
            example: 12
      responses:
        200:
          description: Dashboard statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStatsResponse"
        400:
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsErrorResponse"
        401:
          description: Unauthorized - Invalid or missing token
        403:
          description: Forbidden - Admin access required
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsErrorResponse"

  /stats/users:
    get:
      tags:
        - Statistics API Management
      summary: Get user statistics
      description: Retrieve user statistics with growth metrics and role breakdown
      security:
        - BearerAuth: []
      parameters:
        - name: year
          in: query
          description: Year filter
          required: false
          schema:
            type: integer
            example: 2024
        - name: month
          in: query
          description: Month filter (1-12)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 12
            example: 12
        - name: dateFrom
          in: query
          description: Start date filter (ISO 8601 format)
          required: false
          schema:
            type: string
            format: date
            example: "2024-12-01"
        - name: dateTo
          in: query
          description: End date filter (ISO 8601 format)
          required: false
          schema:
            type: string
            format: date
            example: "2024-12-31"
      responses:
        200:
          description: User statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User statistics retrieved successfully"
                  data:
                    $ref: "#/components/schemas/UserStats"
                  filters:
                    $ref: "#/components/schemas/StatsFilters"
        401:
          description: Unauthorized
        403:
          description: Forbidden - Admin access required
        500:
          description: Internal server error

  /stats/orders:
    get:
      tags:
        - Statistics API Management
      summary: Get order statistics
      description: Retrieve order statistics with daily breakdown and growth metrics
      security:
        - BearerAuth: []
      parameters:
        - name: year
          in: query
          description: Year filter
          required: false
          schema:
            type: integer
            example: 2024
        - name: month
          in: query
          description: Month filter (1-12)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 12
            example: 12
        - name: dateFrom
          in: query
          description: Start date filter
          required: false
          schema:
            type: string
            format: date
            example: "2024-12-01"
        - name: dateTo
          in: query
          description: End date filter
          required: false
          schema:
            type: string
            format: date
            example: "2024-12-31"
      responses:
        200:
          description: Order statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Order statistics retrieved successfully"
                  data:
                    $ref: "#/components/schemas/OrderStats"
                  filters:
                    $ref: "#/components/schemas/StatsFilters"
        401:
          description: Unauthorized
        403:
          description: Forbidden - Admin access required
        500:
          description: Internal server error

  /stats/finance:
    get:
      tags:
        - Statistics API Management
      summary: Get financial statistics
      description: Retrieve financial statistics with revenue vs expenses breakdown and monthly data
      security:
        - BearerAuth: []
      parameters:
        - name: year
          in: query
          description: Year filter
          required: false
          schema:
            type: integer
            example: 2024
        - name: month
          in: query
          description: Month filter (1-12)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 12
            example: 12
        - name: dateFrom
          in: query
          description: Start date filter
          required: false
          schema:
            type: string
            format: date
            example: "2024-12-01"
        - name: dateTo
          in: query
          description: End date filter
          required: false
          schema:
            type: string
            format: date
            example: "2024-12-31"
      responses:
        200:
          description: Finance statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Finance statistics retrieved successfully"
                  data:
                    $ref: "#/components/schemas/FinanceStats"
                  filters:
                    $ref: "#/components/schemas/StatsFilters"
        401:
          description: Unauthorized
        403:
          description: Forbidden - Admin access required
        500:
          description: Internal server error

  /stats/subscriptions:
    get:
      tags:
        - Statistics API Management
      summary: Get subscription statistics
      description: Retrieve subscription statistics with plan breakdown and growth metrics
      security:
        - BearerAuth: []
      parameters:
        - name: year
          in: query
          description: Year filter
          required: false
          schema:
            type: integer
            example: 2024
        - name: month
          in: query
          description: Month filter (1-12)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 12
            example: 12
        - name: dateFrom
          in: query
          description: Start date filter
          required: false
          schema:
            type: string
            format: date
            example: "2024-12-01"
        - name: dateTo
          in: query
          description: End date filter
          required: false
          schema:
            type: string
            format: date
            example: "2024-12-31"
      responses:
        200:
          description: Subscription statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Subscription statistics retrieved successfully"
                  data:
                    $ref: "#/components/schemas/SubscriptionStats"
                  filters:
                    $ref: "#/components/schemas/StatsFilters"
        401:
          description: Unauthorized
        403:
          description: Forbidden - Admin access required
        500:
          description: Internal server error

  /stats/vouchers:
    get:
      tags:
        - Statistics API Management
      summary: Get voucher statistics
      description: Retrieve voucher statistics with usage metrics and growth data
      security:
        - BearerAuth: []
      parameters:
        - name: year
          in: query
          description: Year filter
          required: false
          schema:
            type: integer
            example: 2024
        - name: month
          in: query
          description: Month filter (1-12)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 12
            example: 12
        - name: dateFrom
          in: query
          description: Start date filter
          required: false
          schema:
            type: string
            format: date
            example: "2024-12-01"
        - name: dateTo
          in: query
          description: End date filter
          required: false
          schema:
            type: string
            format: date
            example: "2024-12-31"
      responses:
        200:
          description: Voucher statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Voucher statistics retrieved successfully"
                  data:
                    $ref: "#/components/schemas/VoucherStats"
                  filters:
                    $ref: "#/components/schemas/StatsFilters"
        401:
          description: Unauthorized
        403:
          description: Forbidden - Admin access required
        500:
          description: Internal server error

  /stats/quick:
    get:
      tags:
        - Statistics API Management
      summary: Get quick statistics
      description: Retrieve quick statistics for dashboard cards with percentage changes
      security:
        - BearerAuth: []
      parameters:
        - name: year
          in: query
          description: Year filter
          required: false
          schema:
            type: integer
            example: 2024
        - name: month
          in: query
          description: Month filter (1-12)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 12
            example: 12
        - name: dateFrom
          in: query
          description: Start date filter
          required: false
          schema:
            type: string
            format: date
            example: "2024-12-01"
        - name: dateTo
          in: query
          description: End date filter
          required: false
          schema:
            type: string
            format: date
            example: "2024-12-31"
      responses:
        200:
          description: Quick statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Quick statistics retrieved successfully"
                  data:
                    $ref: "#/components/schemas/QuickStats"
                  filters:
                    $ref: "#/components/schemas/StatsFilters"
        401:
          description: Unauthorized
        403:
          description: Forbidden - Admin access required
        500:
          description: Internal server error

  /stats/activities:
    get:
      tags:
        - Statistics API Management
      summary: Get recent activities
      description: Retrieve the 10 most recent system activities across all sections
      security:
        - BearerAuth: []
      responses:
        200:
          description: Recent activities retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Recent activities retrieved successfully"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecentActivity"
        401:
          description: Unauthorized
        403:
          description: Forbidden - Admin access required
        500:
          description: Internal server error

  /stats/system-status:
    get:
      tags:
        - Statistics API Management
      summary: Get system status
      description: Retrieve system health status including API, database, WebSocket, and external services
      security:
        - BearerAuth: []
      responses:
        200:
          description: System status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "System status retrieved successfully"
                  data:
                    $ref: "#/components/schemas/SystemStatus"
        401:
          description: Unauthorized
        403:
          description: Forbidden - Admin access required
        500:
          description: Internal server error
