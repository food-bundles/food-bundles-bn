tags:
  - name: Subscription Management API
    description: Comprehensive subscription management for restaurants including plans, subscriptions, payments (Wallet Balance, Mobile Money, Card, Bank Transfer), and lifecycle management

components:
  schemas:
    SubscriptionPlan:
      type: object
      properties:
        id:
          type: string
          description: Unique plan identifier
        name:
          type: string
          description: Plan name
        description:
          type: string
          nullable: true
          description: Plan description
        price:
          type: number
          format: float
          description: Plan price
        voucherAccess:
          type: boolean
          default: false
          description: Whether voucher access is enabled
        voucherPaymentDays:
          type: integer
          nullable: true
          description: Number of days allowed for voucher payment
        freeDelivery:
          type: boolean
          default: false
          description: Whether free delivery is included
        stablePricing:
          type: boolean
          default: false
          description: Whether stable pricing is enabled
        receiveEBM:
          type: boolean
          default: false
          description: Whether EBM purchase orders are enabled
        advertisingAccess:
          type: boolean
          default: false
          description: Whether advertising access is enabled
        otherServices:
          type: boolean
          default: false
          description: Whether other services is enabled
        duration:
          type: integer
          description: Duration in days
        features:
          type: array
          items:
            type: string
          nullable: true
          description: List of plan features
          example:
            - "Receive EBM Purchase Orders"
            - "Stable Price"
            - "Free Delivery"
        isActive:
          type: boolean
          description: Whether plan is active
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        _count:
          type: object
          properties:
            subscriptions:
              type: integer
              description: Number of active subscriptions

    RestaurantSubscription:
      type: object
      properties:
        id:
          type: string
          description: Unique subscription identifier
        restaurantId:
          type: string
          description: Restaurant ID
        planId:
          type: string
          description: Subscription plan ID
        status:
          type: string
          enum: [ACTIVE, EXPIRED, CANCELLED, SUSPENDED, PENDING]
          description: Subscription status
        startDate:
          type: string
          format: date-time
          description: Subscription start date
        endDate:
          type: string
          format: date-time
          description: Subscription end date
        autoRenew:
          type: boolean
          description: Auto-renewal enabled
        paymentMethod:
          type: string
          enum: [CASH, MOBILE_MONEY, BANK_TRANSFER, CARD]
          nullable: true
          description: Payment method
        paymentStatus:
          type: string
          enum: [PENDING, PROCESSING, COMPLETED, FAILED, CANCELLED, REFUNDED]
          description: Payment status
        txRef:
          type: string
          nullable: true
          description: Transaction reference
        flwRef:
          type: string
          nullable: true
          description: Flutterwave/PayPack reference
        transactionId:
          type: string
          nullable: true
          description: Transaction ID
        amountPaid:
          type: number
          format: float
          nullable: true
          description: Amount paid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        restaurant:
          $ref: "#/components/schemas/RestaurantInfo"
        plan:
          $ref: "#/components/schemas/SubscriptionPlan"
        payments:
          type: array
          items:
            $ref: "#/components/schemas/SubscriptionPayment"
        history:
          type: array
          items:
            $ref: "#/components/schemas/SubscriptionHistory"

    RestaurantInfo:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string

    SubscriptionPayment:
      type: object
      properties:
        id:
          type: string
        subscriptionId:
          type: string
        amount:
          type: number
          format: float
        paymentMethod:
          type: string
          enum: [CASH, MOBILE_MONEY, BANK_TRANSFER, CARD]
        paymentStatus:
          type: string
          enum: [PENDING, PROCESSING, COMPLETED, FAILED, CANCELLED, REFUNDED]
        txRef:
          type: string
          nullable: true
        flwRef:
          type: string
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    SubscriptionHistory:
      type: object
      properties:
        id:
          type: string
        subscriptionId:
          type: string
        action:
          type: string
          enum:
            [
              CREATED,
              RENEWED,
              UPGRADED,
              DOWNGRADED,
              CANCELLED,
              SUSPENDED,
              REACTIVATED,
              EXPIRED,
            ]
        oldStatus:
          type: string
          enum: [ACTIVE, EXPIRED, CANCELLED, SUSPENDED, PENDING]
          nullable: true
        newStatus:
          type: string
          enum: [ACTIVE, EXPIRED, CANCELLED, SUSPENDED, PENDING]
          nullable: true
        oldPlanId:
          type: string
          nullable: true
        newPlanId:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
        performedBy:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    CreateSubscriptionPlanRequest:
      type: object
      required:
        - name
        - price
        - duration
      properties:
        name:
          type: string
          description: Plan name (must be unique)
          example: "Premium Plan"
        description:
          type: string
          description: Plan description
          example: "Premium features for restaurants"
        price:
          type: number
          format: float
          minimum: 0.01
          description: Plan price
          example: 50000
        duration:
          type: integer
          minimum: 1
          description: Duration in days
          example: 30
        voucherAccess:
          type: boolean
          default: false
          description: Enable voucher access
          example: true
        voucherPaymentDays:
          type: integer
          minimum: 1
          description: Number of days for voucher payment (required if voucherAccess is true)
          example: 30
        freeDelivery:
          type: boolean
          default: false
          description: Enable free delivery
          example: true
        stablePricing:
          type: boolean
          default: false
          description: Enable stable pricing
          example: true
        receiveEBM:
          type: boolean
          default: false
          description: Enable EBM purchase orders
          example: true
        advertisingAccess:
          type: boolean
          default: false
          description: Enable advertising access
          example: false
        otherServices:
          type: boolean
          default: false
          description: Enable other services access
          example: false
        features:
          type: array
          items:
            type: string
          description: List of plan features
          example:
            - "Receive EBM Purchase Orders"
            - "Stable Price"
            - "Free Delivery"
            - "Voucher Payment System"
            - "Priority Support"

    UpdateSubscriptionPlanRequest:
      type: object
      properties:
        name:
          type: string
          description: Plan name (must be unique)
        description:
          type: string
          description: Plan description
        price:
          type: number
          format: float
          minimum: 0.01
          description: Plan price
        duration:
          type: integer
          minimum: 1
          description: Duration in days
        voucherAccess:
          type: boolean
          description: Enable/disable voucher access
        voucherPaymentDays:
          type: integer
          minimum: 1
          description: Number of days for voucher payment
        freeDelivery:
          type: boolean
          description: Enable/disable free delivery
        stablePricing:
          type: boolean
          description: Enable/disable stable pricing
        receiveEBM:
          type: boolean
          description: Enable/disable EBM purchase orders
        advertisingAccess:
          type: boolean
          description: Enable/disable advertising access
        otherServices:
          type: boolean
          description: Enable/disable other services access
        features:
          type: array
          items:
            type: string
          description: List of plan features
        isActive:
          type: boolean
          description: Whether plan is active

    CreateRestaurantSubscriptionRequest:
      type: object
      required:
        - planId
      properties:
        restaurantId:
          type: string
          description: Restaurant ID (required for admin users)
        planId:
          type: string
          description: Subscription plan ID
        autoRenew:
          type: boolean
          default: true
          description: Enable auto-renewal
        paymentMethodId:
          type: string
          description: Payment method configuration ID
        phoneNumber:
          type: string
          description: Phone number (required for MOBILE_MONEY)
          example: "0780000000"
        bankDetails:
          type: object
          description: Bank transfer details
          properties:
            clientIp:
              type: string
              description: Client IP address
              example: "154.123.220.1"

    ProcessSubscriptionPaymentRequest:
      type: object
      required:
        - paymentMethod
      properties:
        paymentMethod:
          type: string
          enum: [CASH, MOBILE_MONEY, BANK_TRANSFER, CARD]
          description: Payment method
        phoneNumber:
          type: string
          description: Phone number (required for MOBILE_MONEY)
          example: "0780000000"
        bankDetails:
          type: object
          properties:
            clientIp:
              type: string

    SubscriptionPaymentResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/RestaurantSubscription"
        transactionId:
          type: string
        redirectUrl:
          type: string
          description: Redirect URL for card payments or additional authorization
        transferDetails:
          type: object
          description: Bank transfer details (for BANK_TRANSFER method)
          properties:
            transferReference:
              type: string
            transferAccount:
              type: string
            transferBank:
              type: string
            transferAmount:
              type: number
            transferNote:
              type: string
            accountExpiration:
              type: string
              format: date-time
        status:
          type: string
          enum: [pending, successful, failed]

    UpdateSubscriptionRequest:
      type: object
      properties:
        status:
          type: string
          enum: [ACTIVE, EXPIRED, CANCELLED, SUSPENDED, PENDING]
          description: Subscription status (Admin only)
        autoRenew:
          type: boolean
          description: Enable/disable auto-renewal
        endDate:
          type: string
          format: date-time
          description: Update end date

    CancelSubscriptionRequest:
      type: object
      properties:
        reason:
          type: string
          description: Reason for cancellation
          example: "Not using the service"

    RenewSubscriptionRequest:
      type: object
      properties:
        paymentMethodId:
          type: string
          description: Payment method configuration ID
        phoneNumber:
          type: string
          description: Phone number (required for MOBILE_MONEY)
          example: "0780000000"
        bankDetails:
          type: object
          description: Bank transfer details
          properties:
            clientIp:
              type: string
              description: Client IP address
              example: "154.123.220.1"

    UpgradeSubscriptionRequest:
      type: object
      required:
        - newPlanId
      properties:
        newPlanId:
          type: string
          description: ID of the plan to upgrade to
        paymentMethodId:
          type: string
          description: Payment method configuration ID
        phoneNumber:
          type: string
          description: Phone number (required for MOBILE_MONEY)
          example: "0780000000"
        bankDetails:
          type: object
          description: Bank transfer details
          properties:
            clientIp:
              type: string
              description: Client IP address
              example: "154.123.220.1"

    AdminCreateSubscriptionRequest:
      type: object
      required:
        - restaurantId
        - planId
        - paymentMethodId
      properties:
        restaurantId:
          type: string
          description: Restaurant ID
          example: "rest_123"
        planId:
          type: string
          description: Subscription plan ID
          example: "plan_123"
        paymentMethodId:
          type: string
          description: Payment method configuration ID
          example: "pm_mobile_money_123"
        phoneNumber:
          type: string
          description: Phone number (required for MOBILE_MONEY)
          example: "0780000000"
        bankDetails:
          type: object
          description: Bank transfer details
          properties:
            clientIp:
              type: string
              description: Client IP address
              example: "154.123.220.1"

    PaginationResponse:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    ApiResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: object

    ErrorResponse:
      type: object
      properties:
        message:
          type: string

paths:
  /subscriptions/plans:
    post:
      tags:
        - Subscription Management API
      summary: Create subscription plan
      description: Create a new subscription plan (Admin only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionPlanRequest"
            examples:
              basicPlan:
                summary: Basic Plan
                value:
                  name: "Basic Plan"
                  description: "Basic features for small restaurants"
                  price: 25000
                  duration: 30
                  voucherAccess: false
                  freeDelivery: false
                  stablePricing: false
                  receiveEBM: false
                  advertisingAccess: false
                  otherServices: false
                  features:
                    - "Basic support"
                    - "Standard delivery"
              premiumPlan:
                summary: Premium Plan
                value:
                  name: "Premium Plan"
                  description: "Premium features with voucher access"
                  price: 50000
                  duration: 30
                  voucherAccess: true
                  voucherPaymentDays: 30
                  freeDelivery: true
                  stablePricing: true
                  receiveEBM: true
                  advertisingAccess: true
                  otherServices: true
                  features:
                    - "Receive EBM Purchase Orders"
                    - "Stable Pricing"
                    - "Free Delivery"
                    - "Voucher Payment (30 days)"
                    - "Advertising Access"
                    - "Priority Support"
      responses:
        201:
          description: Subscription plan created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Subscription plan created successfully"
                  data:
                    $ref: "#/components/schemas/SubscriptionPlan"
        400:
          description: Bad request - Invalid input or plan name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        401:
          description: Unauthorized
        403:
          description: Forbidden - Admin access required
        500:
          description: Internal server error

    get:
      tags:
        - Subscription Management API
      summary: Get all subscription plans
      description: Retrieve all subscription plans with pagination
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: isActive
          in: query
          schema:
            type: boolean
          description: Filter by active status
      responses:
        200:
          description: Plans retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SubscriptionPlan"
                  pagination:
                    $ref: "#/components/schemas/PaginationResponse"
        500:
          description: Internal server error

  /subscriptions/plans/{planId}:
    get:
      tags:
        - Subscription Management API
      summary: Get subscription plan by ID
      description: Retrieve a specific subscription plan
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Plan retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/SubscriptionPlan"
        404:
          description: Plan not found
        500:
          description: Internal server error

    patch:
      tags:
        - Subscription Management API
      summary: Update subscription plan
      description: Update an existing subscription plan (Admin only)
      security:
        - BearerAuth: []
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubscriptionPlanRequest"
            examples:
              updateFeatures:
                summary: Update Plan Features
                value:
                  voucherAccess: true
                  voucherPaymentDays: 45
                  freeDelivery: true
                  receiveEBM: true
                  otherServices: true
              updatePrice:
                summary: Update Price and Duration
                value:
                  price: 60000
                  duration: 60
              disableFeatures:
                summary: Disable Specific Features
                value:
                  advertisingAccess: false
                  voucherAccess: false
                  otherServices: false
      responses:
        200:
          description: Plan updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/SubscriptionPlan"
        400:
          description: Bad request
        401:
          description: Unauthorized
        403:
          description: Forbidden - Admin access required
        404:
          description: Plan not found
        500:
          description: Internal server error

    delete:
      tags:
        - Subscription Management API
      summary: Delete subscription plan
      description: Delete a subscription plan (Admin only, only if no active subscriptions)
      security:
        - BearerAuth: []
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Plan deleted successfully
        400:
          description: Cannot delete plan with active subscriptions
        401:
          description: Unauthorized
        403:
          description: Forbidden - Admin access required
        404:
          description: Plan not found
        500:
          description: Internal server error

  /subscriptions/restaurant:
    post:
      tags:
        - Subscription Management API
      summary: Create restaurant subscription with payment
      description: Create a new subscription for a restaurant and optionally process payment immediately
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRestaurantSubscriptionRequest"
            examples:
              cash:
                summary: Cash Payment (Wallet Balance)
                value:
                  planId: "plan_123"
                  autoRenew: true
                  paymentMethodId: "pm_cash_123"
              mobileMoney:
                summary: Mobile Money Payment
                value:
                  planId: "plan_123"
                  autoRenew: true
                  paymentMethodId: "pm_mobile_money_123"
                  phoneNumber: "0780000000"
              card:
                summary: Card Payment (Hosted Checkout)
                value:
                  planId: "plan_123"
                  autoRenew: true
                  paymentMethodId: "pm_card_123"
                  phoneNumber: "0780000000"
              bankTransfer:
                summary: Bank Transfer
                value:
                  planId: "plan_123"
                  autoRenew: true
                  paymentMethodId: "pm_bank_transfer_123"
                  phoneNumber: "0780000000"
                  bankDetails:
                    clientIp: "154.123.220.1"
      responses:
        201:
          description: Subscription created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/RestaurantSubscription"
                  payment:
                    $ref: "#/components/schemas/SubscriptionPaymentResponse"
        400:
          description: Bad request - Invalid plan or restaurant already has active subscription
        401:
          description: Unauthorized
        500:
          description: Internal server error

  /subscriptions/{subscriptionId}/pay:
    post:
      tags:
        - Subscription Management API
      summary: Process subscription payment
      description: Process payment for a pending subscription (Wallet Balance, Mobile Money, Card, or Bank Transfer)
      security:
        - BearerAuth: []
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessSubscriptionPaymentRequest"
            examples:
              cash:
                summary: Cash Payment (Wallet Balance)
                value:
                  paymentMethod: "CASH"
              mobileMoney:
                summary: Mobile Money Payment
                value:
                  paymentMethod: "MOBILE_MONEY"
                  phoneNumber: "0780000000"
              card:
                summary: Card Payment
                value:
                  paymentMethod: "CARD"
                  phoneNumber: "0780000000"
              bankTransfer:
                summary: Bank Transfer
                value:
                  paymentMethod: "BANK_TRANSFER"
                  phoneNumber: "0780000000"
                  bankDetails:
                    clientIp: "154.123.220.1"
      responses:
        200:
          description: Payment processed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPaymentResponse"
        400:
          description: Bad request - Invalid payment method or missing required fields
        401:
          description: Unauthorized
        403:
          description: Forbidden
        404:
          description: Subscription not found
        500:
          description: Internal server error

  /subscriptions/my-subscriptions:
    get:
      tags:
        - Subscription Management API
      summary: Get restaurant's subscriptions
      description: Get all subscriptions for the authenticated restaurant
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, EXPIRED, CANCELLED, SUSPENDED, PENDING]
      responses:
        200:
          description: Subscriptions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RestaurantSubscription"
                  pagination:
                    $ref: "#/components/schemas/PaginationResponse"
        401:
          description: Unauthorized
        403:
          description: Forbidden - Restaurant access required
        500:
          description: Internal server error

  /subscriptions/{subscriptionId}:
    get:
      tags:
        - Subscription Management API
      summary: Get subscription by ID
      description: Get detailed subscription information
      security:
        - BearerAuth: []
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Subscription retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/RestaurantSubscription"
        401:
          description: Unauthorized
        403:
          description: Forbidden
        404:
          description: Subscription not found
        500:
          description: Internal server error

    patch:
      tags:
        - Subscription Management API
      summary: Update subscription
      description: Update subscription details (Admin can update status, Restaurant can update autoRenew)
      security:
        - BearerAuth: []
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubscriptionRequest"
      responses:
        200:
          description: Subscription updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/RestaurantSubscription"
        400:
          description: Bad request
        401:
          description: Unauthorized
        403:
          description: Forbidden
        404:
          description: Subscription not found
        500:
          description: Internal server error

  /subscriptions/{subscriptionId}/cancel:
    post:
      tags:
        - Subscription Management API
      summary: Cancel subscription
      description: Cancel an active subscription
      security:
        - BearerAuth: []
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelSubscriptionRequest"
      responses:
        200:
          description: Subscription cancelled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/RestaurantSubscription"
        400:
          description: Subscription already cancelled
        401:
          description: Unauthorized
        403:
          description: Forbidden
        404:
          description: Subscription not found
        500:
          description: Internal server error

  /subscriptions/renew:
    post:
      tags:
        - Subscription Management API
      summary: Renew subscription
      description: Renew an expired subscription with payment processing
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewSubscriptionRequest"
            examples:
              mobileMoney:
                summary: Mobile Money Payment
                value:
                  paymentMethodId: "pm_mobile_money_123"
                  phoneNumber: "0780000000"
              card:
                summary: Card Payment (Hosted Checkout)
                value:
                  paymentMethodId: "pm_card_123"
                  phoneNumber: "0780000000"
              bankTransfer:
                summary: Bank Transfer
                value:
                  paymentMethodId: "pm_bank_transfer_123"
                  phoneNumber: "0780000000"
                  bankDetails:
                    clientIp: "154.123.220.1"
      responses:
        200:
          description: Subscription renewed successfully
          content:
