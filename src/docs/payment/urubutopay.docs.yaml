  /payments/urubutopay/disbursement/initiate:
    post:
      tags: [UrubutoPay Disbursement]
      summary: Initiate a bulk disbursement
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/UrubutopayDisbursementRequest" }
            examples:
              mobile_money_batch:
                summary: Pay multiple MTN MoMo beneficiaries
                value:
                  source_of_funds: "FoodBundles supplier settlement"
                  source_payment_channel: MERCHANT_WALLET
                  destination_payment_channel: MOMO
                  external_transaction_ref_number: "DISB-2026-001"
                  beneficiary_to_be_charged: "NO"
                  wallet_account_id: "WALLET-MAIN-001"
                  beneficiaries:
                    - {
                        beneficiary_names: "Aline Mukamana",
                        beneficiary_phone_number: "250722123456",
                        amount: 15000,
                        beneficiary_code: "BEN-001",
                        description: "Supplier settlement",
                      }
                    - {
                        beneficiary_names: "Jean Claude",
                        beneficiary_phone_number: "250781234567",
                        amount: 22000,
                        beneficiary_code: "BEN-002",
                        description: "Supplier settlement",
                      }
              airtel_single_beneficiary:
                summary: Single Airtel Money transfer
                value:
                  source_of_funds: "Refund"
                  source_payment_channel: MERCHANT_WALLET
                  destination_payment_channel: AIRTEL_MONEY
                  external_transaction_ref_number: "DISB-2026-002"
                  beneficiary_to_be_charged: "NO"
                  beneficiaries:
                    - {
                        beneficiary_names: "Paul Niyonzima",
                        beneficiary_phone_number: "250733123456",
                        amount: 5000,
                        beneficiary_code: "BEN-003",
                        description: "Order refund",
                      }
      responses:
        "200":
          description: Disbursement initiated
          content:
            application/json:
              examples:
                accepted:
                  {
                    value:
                      {
                        timestamp: "2026-10-25 10:30:00",
                        status: 200,
                        message: "Disbursement initiated",
                        data:
                          {
                            internal_transaction_ref_number: "URB-DISB-20261025-001",
                            external_transaction_ref_number: "DISB-2026-001",
                            status: PENDING,
                          },
                      },
                  }
        "400":
          description: Invalid disbursement
          content:
            application/json:
              examples:
                empty_beneficiaries:
                  value:
                    {
                      timestamp: "2026-10-25 10:30:00",
                      status: 400,
                      message: "At least one beneficiary is required",
                    }

  /payments/urubutopay/disbursement/check-transaction:
    post:
      tags: [UrubutoPay Disbursement]
      summary: Check a bulk-disbursement transaction
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "#/components/schemas/UrubutopayDisbursementTransactionRequest",
              }
            examples:
              pending_disbursement:
                {
                  value:
                    {
                      internal_transaction_ref_number: "URB-DISB-20261025-001",
                    },
                }
              completed_disbursement:
                {
                  value:
                    {
                      internal_transaction_ref_number: "URB-DISB-20261025-002",
                    },
                }
      responses:
        "200":
          description: Disbursement transaction status
          content:
            application/json:
              examples:
                pending:
                  {
                    value:
                      {
                        status: 200,
                        data:
                          {
                            internal_transaction_ref_number: "URB-DISB-20261025-001",
                            transaction_status: PENDING,
                            disbursement_status: PROCESSING,
                          },
                      },
                  }
                completed:
                  {
                    value:
                      {
                        status: 200,
                        data:
                          {
                            internal_transaction_ref_number: "URB-DISB-20261025-002",
                            transaction_status: SUCCESSFUL,
                            disbursement_status: COMPLETED,
                          },
                      },
                  }

