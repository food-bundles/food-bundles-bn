  /webhooks/urubutopay:
    post:
      tags: [UrubutoPay Webhooks]
      summary: Receive UrubutoPay callbacks
      description: UrubutoPay sends payment, invoice, recurring, debit, and transfer callbacks here. Authentication uses the webhook Bearer token.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UrubutopayWebhookPayment" }
            examples:
              payment_successful:
                summary: Payment completed callback
                value:
                  {
                    callback_type: PAYMENT,
                    status: 200,
                    transaction_status: SUCCESSFUL,
                    merchant_code: MERCHANT001,
                    payer_code: "250781234567",
                    payment_channel: MOMO,
                    payment_channel_name: MTN_MOBILE_MONEY,
                    amount: 5000,
                    currency: RWF,
                    payment_date_time: "2026-10-25 10:34:12",
                    internal_transaction_id: "URB-INT-20261025-001",
                    transaction_id: "ORDER-2026-001",
                  }
              payment_failed:
                summary: Payment failed callback
                value:
                  {
                    callback_type: PAYMENT,
                    status: 200,
                    transaction_status: FAILED,
                    merchant_code: MERCHANT001,
                    payer_code: "250781234567",
                    payment_channel: MOMO,
                    payment_channel_name: MTN_MOBILE_MONEY,
                    amount: 5000,
                    currency: RWF,
                    payment_date_time: "2026-10-25 10:34:12",
                    internal_transaction_id: "URB-INT-20261025-001",
                    transaction_id: "ORDER-2026-001",
                    reason: INSUFFICIENT_FUNDS,
                  }
              invoice_paid:
                summary: Invoice paid callback
                value:
                  {
                    callback_type: INVOICE,
                    invoice_number: "INV-20261025-001",
                    status: PAID,
                    amount: 12500,
                    currency: RWF,
                    payer_names: "Jean Claude",
                    payer_phone_number: "250781234567",
                    created_at: "2026-10-25 10:30:00",
                    merchant_code: MERCHANT001,
                    service_code: FOODBUNDLES,
                  }
              recurring_payment:
                summary: Recurring cycle callback
                value:
                  {
                    callback_type: RECURRING,
                    token: "RT-8F3A6B2C",
                    merchant_code: MERCHANT001,
                    payer_code: "250781234567",
                    service_code: FOODBUNDLES,
                    amount: 30000,
                    currency: RWF,
                    payment_channel: MOMO,
                    payment_channel_name: MTN_MOBILE_MONEY,
                    next_payment_date: "2026-11-25",
                    expires_at: "2027-10-25",
                    interval_unit: MONTH,
                    cycle_count: 2,
                  }
              disbursement_payment:
                summary: Disbursement transfer callback
                value:
                  {
                    callback_type: BULK_DISBURSEMENT_PAYMENT,
                    internal_transaction_ref_number: "URB-DISB-20261025-001",
                    transaction_date: "2026-10-25 10:30:00",
                    transaction_status: SUCCESSFUL,
                    amount: 15000,
                    currency: RWF,
                    beneficiary_names: "Aline Mukamana",
                    beneficiary_phone_number: "250722123456",
                    beneficiary_code: "BEN-001",
                    source_payment_channel: MERCHANT_WALLET,
                    destination_payment_channel: MOMO,
                  }
      responses:
        "200":
          description: Callback acknowledged
          content:
            application/json:
              examples:
                received:
                  {
                    value:
                      {
                        timestamp: "2026-10-25 10:35:00",
                        status: 200,
                        message: "Callback received successfully",
                      },
                  }
        "401":
          description: Invalid webhook bearer token
          content:
            application/json:
              examples:
                unauthorized: { value: { status: 401, message: Unauthorized } }

  /webhooks/urubutopay/auth:
    post:
      tags: [UrubutoPay Webhooks]
      summary: Authenticate a UrubutoPay webhook connection
      description: Provider onboarding calls this endpoint with configured credentials to obtain the webhook bearer token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/UrubutopayWebhookAuthRequest" }
            examples:
              valid_credentials:
                summary: Valid webhook credentials
                value:
                  {
                    user_name: "foodbundles-webhook",
                    password: "replace-with-secret",
                  }
              invalid_credentials:
                summary: Invalid credential selector
                value:
                  {
                    user_name: "foodbundles-webhook",
                    password: "wrong-password",
                  }
      responses:
        "200":
          description: Bearer token returned
          content:
            application/json:
              examples:
                authenticated:
                  value:
                    {
                      timestamp: "2026-10-25 10:30:00",
                      status: 200,
                      message: Successful,
                      data: { token: "Bearer replace-with-token" },
                    }
        "401":
          description: Invalid webhook username or password
          content:
            application/json:
              examples:
                invalid_credentials:
                  value:
                    {
                      timestamp: "2026-10-25 10:30:00",
                      status: 401,
                      message: "Invalid credentials",
                    }
