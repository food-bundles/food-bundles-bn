openapi: 3.0.0
paths:
  /mobile/restaurant/products:
    get:
      tags:
        - Mobile Restaurant — Products
      summary: List products available for purchase
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: categoryId
          schema:
            type: string
          description: Filter by category ID
        - in: query
          name: search
          schema:
            type: string
          description: Search by product name or SKU
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Products list with pagination
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MobileProduct"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          description: Unauthorized

  /mobile/restaurant/products/{productId}:
    get:
      tags:
        - Mobile Restaurant — Products
      summary: Get a single product by ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/MobileProduct"
        "404":
          description: Product not found

components:
  schemas:
    MobileProduct:
      type: object
      properties:
        id:
          type: string
        productName:
          type: string
        unitPrice:
          type: number
        discountedPrice:
          type: number
          nullable: true
        bonus:
          type: number
        unit:
          type: string
        quantity:
          type: integer
        images:
          type: array
          items:
            type: string
        category:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
        latestMarketPrices:
          type: array
          items:
            type: object
    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
