tags:
  - name: Trader API Management
    description: Operations for trader functionality including wallet, loans, vouchers, and commission management

components:
  schemas:
    TraderWallet:
      type: object
      properties:
        id:
          type: string
          description: Wallet ID
        balance:
          type: number
          format: float
          description: Current wallet balance
        pendingApprovedAmount:
          type: number
          format: float
          description: Amount approved for active vouchers
        commission:
          type: number
          format: float
          description: Commission percentage
          example: 5.0
        currency:
          type: string
          description: Wallet currency
          example: "RWF"
        isActive:
          type: boolean
          description: Wallet status
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TraderTopUpRequest:
      type: object
      required:
        - amount
        - paymentMethod
      properties:
        amount:
          type: number
          format: float
          description: Amount to top up
          example: 100000
        paymentMethod:
          type: string
          enum: [MOBILE_MONEY, CARD, BANK_TRANSFER]
          description: Payment method
        phoneNumber:
          type: string
          description: Phone number for mobile money
          example: "+250788123456"
        description:
          type: string
          description: Transaction description


    TraderCommission:
      type: object
      properties:
        totalCommission:
          type: number
          format: float
          description: Total commission earned
        commissionDetails:
          type: array
          items:
            type: object
            properties:
              voucherId:
                type: string
              orderId:
                type: string
              orderAmount:
                type: number
                format: float
              commission:
                type: number
                format: float
              orderDate:
                type: string
                format: date-time

    SetCommissionRequest:
      type: object
      required:
        - commission
      properties:
        commission:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Commission percentage
          example: 7.5

    TraderTransaction:
      type: object
      properties:
        id:
          type: string
          description: Transaction ID
        traderId:
          type: string
          description: Trader ID
        type:
          type: string
          enum: [LOAN_APPROVAL, COMMISSION_EARNED, COMMISSION_PAID, WALLET_TOPUP, WALLET_DEBIT]
          description: Transaction type
        amount:
          type: number
          format: float
          description: Transaction amount
        orderId:
          type: string
          nullable: true
          description: Related order ID
        voucherId:
          type: string
          nullable: true
          description: Related voucher ID
        loanId:
          type: string
          nullable: true
          description: Related loan ID
        reference:
          type: string
          nullable: true
          description: Generic reference
        isCommissionPaid:
          type: boolean
          description: Commission payment status
        commissionRate:
          type: number
          format: float
          nullable: true
          description: Commission rate
        description:
          type: string
          nullable: true
          description: Transaction description
        status:
          type: string
          enum: [PENDING, PROCESSING, COMPLETED, FAILED, CANCELLED, REFUNDED]
          description: Transaction status
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TraderTransactionStats:
      type: object
      properties:
        totalTransactions:
          type: integer
          description: Total number of transactions
        loanApprovals:
          type: integer
          description: Number of loan approvals
        commissionsEarned:
          type: integer
          description: Number of commissions earned
        commissionsPaid:
          type: integer
          description: Number of commissions paid
        totalCommissionEarned:
          type: number
          format: float
          description: Total commission amount earned
        totalCommissionPaid:
          type: number
          format: float
          description: Total commission amount paid
        totalLoansApproved:
          type: number
          format: float
          description: Total loan amount approved

    TraderDashboard:
      type: object
      properties:
        walletBalance:
          type: number
          format: float
          description: Current wallet balance
        totalVouchersApproved:
          type: number
          description: Total vouchers approved by trader
        totalVouchersAmount:
          type: number
          format: float
          description: Total amount of vouchers approved by trader
        activeVouchers:
          type: number
          description: Currently active vouchers
        totalOrdersProcessed:
          type: number
          description: Total orders processed with trader vouchers
        totalCommissionEarned:
          type: number
          format: float
          description: Total commission earned
        pendingCommission:
          type: number
          format: float
          description: Pending commission to be processed

paths:
  /traders/wallet:
    post:
      tags:
        - Trader API Management
      summary: Create trader wallet
      security:
        - BearerAuth: []
      responses:
        201:
          description: Trader wallet created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/TraderWallet"
        400:
          description: Bad request

    get:
      tags:
        - Trader API Management
      summary: Get trader wallet
      security:
        - BearerAuth: []
      responses:
        200:
          description: Trader wallet retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/TraderWallet"

  /traders/wallet/topup:
    post:
      tags:
        - Trader API Management
      summary: Top up trader wallet
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TraderTopUpRequest"
      responses:
        200:
          description: Wallet top-up initiated successfully
        400:
          description: Bad request

  /traders/loans:
    get:
      tags:
        - Trader API Management
      summary: Get loan applications for trader
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED, DISBURSED, PAID, SETTLED]
        - name: restaurantId
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        200:
          description: Loan applications retrieved successfully

  /traders/loans/{loanId}/approve:
    post:
      tags:
        - Trader API Management
      summary: Approve loan application using original terms
      description: Approve a loan application using the original requested amount and payment days. Only loans with ACCEPTED status can be approved.
      security:
        - BearerAuth: []
      parameters:
        - name: loanId
          in: path
          required: true
          schema:
            type: string
          description: ID of the loan application to approve
      responses:
        200:
          description: Loan approved successfully using original terms
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Loan approved successfully"
                  data:
                    type: object
                    description: Approved loan and voucher details
        400:
          description: Insufficient available balance, loan not accepted, or bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    examples:
                      insufficient_balance:
                        value: "Insufficient available balance. Available: 10000 RWF, Required: 50000 RWF"
                      not_accepted:
                        value: "Can only approve loans with ACCEPTED status"
                      not_found:
                        value: "Loan application not found"

  /traders/vouchers:
    get:
      tags:
        - Trader API Management
      summary: Get vouchers approved by trader
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [ACCEPTED, ACTIVE, USED, EXPIRED, SUSPENDED, SETTLED, MATURED]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        200:
          description: Vouchers retrieved successfully (only ACCEPTED vouchers and those approved by trader)

  /traders/commission:
    get:
      tags:
        - Trader API Management
      summary: Get trader commission details
      security:
        - BearerAuth: []
      responses:
        200:
          description: Commission details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/TraderCommission"

  /traders/commission/process:
    post:
      tags:
        - Trader API Management
      summary: Process commission payment to trader wallet
      security:
        - BearerAuth: []
      responses:
        200:
          description: Commission processed successfully
        400:
          description: No commission available

  /traders/orders:
    get:
      tags:
        - Trader API Management
      summary: Get orders paid with trader vouchers
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        200:
          description: Orders retrieved successfully

  /traders/transactions:
    get:
      tags:
        - Trader API Management
      summary: Get trader transaction history
      security:
        - BearerAuth: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [LOAN_APPROVAL, COMMISSION_EARNED, COMMISSION_PAID, WALLET_TOPUP, WALLET_DEBIT]
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, PROCESSING, COMPLETED, FAILED, CANCELLED, REFUNDED]
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        200:
          description: Transaction history retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TraderTransaction"
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer

  /traders/transactions/stats:
    get:
      tags:
        - Trader API Management
      summary: Get trader transaction statistics
      security:
        - BearerAuth: []
      responses:
        200:
          description: Transaction statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/TraderTransactionStats"

  /traders/transactions/{transactionId}:
    get:
      tags:
        - Trader API Management
      summary: Get trader transaction by ID
      security:
        - BearerAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Transaction retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/TraderTransaction"
        404:
          description: Transaction not found

  /traders/dashboard:
    get:
      tags:
        - Trader API Management
      summary: Get trader dashboard statistics
      security:
        - BearerAuth: []
      responses:
        200:
          description: Dashboard statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/TraderDashboard"

  /traders/{traderId}/commission:
    patch:
      tags:
        - Trader API Management
      summary: Set trader wallet commission (Admin only)
      security:
        - BearerAuth: []
      parameters:
        - name: traderId
          in: path
          required: true
          schema:
            type: string
          description: Trader ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetCommissionRequest"
      responses:
        200:
          description: Commission updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/TraderWallet"
        400:
          description: Invalid commission value
        403:
          description: Admin access required
