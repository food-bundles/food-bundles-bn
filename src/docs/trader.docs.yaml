  /traders/delegation/{traderId}/approve:
    post:
      tags:
        - Trader API Management
      summary: Admin initiate delegation approval with OTP
      description: |
        Admin initiates delegation approval by setting commission percentage.
        System sends OTP to trader's phone and email.
        Also sends notification to PRIVATE_RECEIVER.
        Returns sessionId for OTP verification step.
      security:
        - BearerAuth: []
      parameters:
        - name: traderId
          in: path
          required: true
          schema:
            type: string
          description: Trader ID to approve delegation for
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - commission
              properties:
                commission:
                  type: number
                  format: float
                  minimum: 0
                  maximum: 100
                  description: Commission percentage for trader
                  example: 5.0
            examples:
              set_commission:
                summary: Set 5% Commission
                value:
                  commission: 5.0
      responses:
        200:
          description: OTP sent to trader for verification
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "OTP sent to trader for verification"
                  sessionId:
                    type: string
                    description: Session ID for OTP verification
                    example: "eyJhZG1pbklkIjoiYWRtaW4xMjMiLCJ0cmFkZXJJZCI6InRyYWRlcjQ1NiJ9"
        400:
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
              examples:
                invalid_commission:
                  value:
                    success: false
                    message: "Valid commission percentage (0-100) is required"
                no_request:
                  value:
                    success: false
                    message: "Trader has not requested delegation"
                already_approved:
                  value:
                    success: false
                    message: "Trader already has delegation permission"
        403:
          description: Admin access required
        404:
          description: Trader wallet not found

  /traders/withdraw/request:
