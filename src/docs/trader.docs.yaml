tags:
  - name: Trader API Management
    description: Operations for trader functionality including wallet, loans, vouchers, and commission management

components:
  schemas:
    TraderWallet:
      type: object
      properties:
        id:
          type: string
          description: Wallet ID
        balance:
          type: number
          format: float
          description: Current wallet balance
        availableBalance:
          type: number
          format: float
          description: Available balance for trading (balance - pendingApprovedAmount)
        pendingApprovedAmount:
          type: number
          format: float
          description: Amount approved for active vouchers
        commissionEarned:
          type: number
          format: float
          description: Total commission earned (separate from balance)
        commission:
          type: number
          format: float
          description: Commission percentage
          example: 5.0
        totalDeposited:
          type: number
          format: float
          description: Total amount deposited (never decreases)
        canTradeOnBehalf:
          type: boolean
          description: Whether trader can approve loans
        delegationRequestedAt:
          type: string
          format: date-time
          nullable: true
          description: When delegation was requested
        delegationApprovedAt:
          type: string
          format: date-time
          nullable: true
          description: When delegation was approved
        totalVouchersAmount:
          type: number
          format: float
          description: Total amount of vouchers approved by trader
        totalVouchersCount:
          type: number
          description: Total number of vouchers approved by trader
        currency:
          type: string
          description: Wallet currency
          example: "RWF"
        isActive:
          type: boolean
          description: Wallet status
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TraderTopUpResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Wallet top-up processed successfully"
        data:
          type: object
          properties:
            wallet:
              $ref: "#/components/schemas/TraderWallet"
            transaction:
              type: object
              properties:
                id:
                  type: string
                amount:
                  type: number
                  format: float
                paymentMethod:
                  type: object
                  properties:
                    id:
                      type: string
                      description: Payment method ID
                    name:
                      type: string
                      description: Payment method name
                      example: "MOBILE_MONEY"
                    description:
                      type: string
                      description: Payment method description
                status:
                  type: string
                  example: "COMPLETED"
                createdAt:
                  type: string
                  format: date-time
            redirectUrl:
              type: string
              nullable: true
              description: Redirect URL for payment completion (if required)
            requiresRedirect:
              type: boolean
              description: Whether payment requires redirect

    TraderTopUpRequest:
      type: object
      required:
        - amount
        - paymentMethodId
      properties:
        amount:
          type: number
          format: float
          description: Amount to top up
          example: 100000
        paymentMethodId:
          type: string
          description: Payment method ID from PaymentMethodConfig
          example: "uuid-of-payment-method"
        phoneNumber:
          type: string
          description: Phone number for mobile money
          example: "+250788123456"
        description:
          type: string
          description: Transaction description

    TraderCommission:
      type: object
      properties:
        totalCommission:
          type: number
          format: float
          description: Total commission earned
        commissionDetails:
          type: array
          items:
            type: object
            properties:
              voucherId:
                type: string
              orderId:
                type: string
              orderAmount:
                type: number
                format: float
              commission:
                type: number
                format: float
              orderDate:
                type: string
                format: date-time

    SetCommissionRequest:
      type: object
      required:
        - commission
      properties:
        commission:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Commission percentage
          example: 7.5

    TraderTransaction:
      type: object
      properties:
        id:
          type: string
          description: Transaction ID
        traderId:
          type: string
          description: Trader ID
        type:
          type: string
          enum:
            [
              LOAN_APPROVAL,
              COMMISSION_EARNED,
              COMMISSION_PAID,
              WALLET_TOPUP,
              WALLET_DEBIT,
            ]
          description: Transaction type
        amount:
          type: number
          format: float
          description: Transaction amount
        orderId:
          type: string
          nullable: true
          description: Related order ID
        voucherId:
          type: string
          nullable: true
          description: Related voucher ID
        loanId:
          type: string
          nullable: true
          description: Related loan ID
        reference:
          type: string
          nullable: true
          description: Generic reference
        isCommissionPaid:
          type: boolean
          description: Commission payment status
        commissionRate:
          type: number
          format: float
          nullable: true
          description: Commission rate
        description:
          type: string
          nullable: true
          description: Transaction description
        status:
          type: string
          enum: [PENDING, PROCESSING, COMPLETED, FAILED, CANCELLED, REFUNDED]
          description: Transaction status
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TraderTransactionStats:
      type: object
      properties:
        totalTransactions:
          type: integer
          description: Total number of transactions
        loanApprovals:
          type: integer
          description: Number of loan approvals
        commissionsEarned:
          type: integer
          description: Number of commissions earned
        commissionsPaid:
          type: integer
          description: Number of commissions paid
        totalCommissionEarned:
          type: number
          format: float
          description: Total commission amount earned
        totalCommissionPaid:
          type: number
          format: float
          description: Total commission amount paid
        totalLoansApproved:
          type: number
          format: float
          description: Total loan amount approved

    TraderDashboard:
      type: object
      properties:
        walletBalance:
          type: number
          format: float
          description: Current wallet balance
        totalVouchersApproved:
          type: number
          description: Total vouchers approved by trader
        totalVouchersAmount:
          type: number
          format: float
          description: Total amount of vouchers approved by trader
        activeVouchers:
          type: number
          description: Currently active vouchers
        totalOrdersProcessed:
          type: number
          description: Total orders processed with trader vouchers
        totalCommissionEarned:
          type: number
          format: float
          description: Total commission earned
        pendingCommission:
          type: number
          format: float
          description: Pending commission to be processed

paths:
  /traders/wallet:
    post:
      tags:
        - Trader API Management
      summary: Create trader wallet
      security:
        - BearerAuth: []
      responses:
        201:
          description: Trader wallet created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/TraderWallet"
        400:
          description: Bad request

    get:
      tags:
        - Trader API Management
      summary: Get trader wallet
      security:
        - BearerAuth: []
      responses:
        200:
          description: Trader wallet retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/TraderWallet"

  /traders/wallet/topup:
    post:
      tags:
        - Trader API Management
      summary: Top up trader wallet
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TraderTopUpRequest"
      responses:
        200:
          description: Wallet top-up initiated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraderTopUpResponse"
        400:
          description: Bad request - Invalid payment method ID or insufficient data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    examples:
                      payment_method_not_found:
                        value: "Payment method not found"
                      payment_method_inactive:
                        value: "Payment method is not active"
                      invalid_amount:
                        value: "Valid amount is required"

  /traders/loans:
    get:
      tags:
        - Trader API Management
      summary: Get loan applications for trader
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED, DISBURSED, PAID, SETTLED]
        - name: restaurantId
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        200:
          description: Loan applications retrieved successfully

  /traders/loans/{loanId}/approve:
    post:
      tags:
        - Trader API Management
      summary: Approve loan application using original terms
      description: Approve a loan application using the original requested amount and payment days. Only loans with ACCEPTED status can be approved.
      security:
        - BearerAuth: []
      parameters:
        - name: loanId
          in: path
          required: true
          schema:
            type: string
          description: ID of the loan application to approve
      responses:
        200:
          description: Loan approved successfully using original terms
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Loan approved successfully"
                  data:
                    type: object
                    description: Approved loan and voucher details
        400:
          description: Insufficient available balance, loan not accepted, or bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    examples:
                      insufficient_balance:
                        value: "Insufficient available balance. Available: 10000 RWF, Required: 50000 RWF"
                      not_accepted:
                        value: "Can only approve loans with ACCEPTED status"
                      not_found:
                        value: "Loan application not found"

  /traders/vouchers:
    get:
      tags:
        - Trader API Management
      summary: Get vouchers approved by trader
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [ACCEPTED, ACTIVE, USED, EXPIRED, SUSPENDED, SETTLED, MATURED]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        200:
          description: Vouchers retrieved successfully (only ACCEPTED vouchers and those approved by trader)

  /traders/commission:
    get:
      tags:
        - Trader API Management
      summary: Get trader commission details
      security:
        - BearerAuth: []
      responses:
        200:
          description: Commission details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/TraderCommission"

  /traders/commission/process:
    post:
      tags:
        - Trader API Management
      summary: Process commission payment to trader wallet
      security:
        - BearerAuth: []
      responses:
        200:
          description: Commission processed successfully
        400:
          description: No commission available

  /traders/orders:
    get:
      tags:
        - Trader API Management
      summary: Get orders paid with trader vouchers
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        200:
          description: Orders retrieved successfully

  /traders/transactions:
    get:
      tags:
        - Trader API Management
      summary: Get trader transaction history
      security:
        - BearerAuth: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum:
              [
                LOAN_APPROVAL,
                COMMISSION_EARNED,
                COMMISSION_PAID,
                WALLET_TOPUP,
                WALLET_DEBIT,
              ]
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, PROCESSING, COMPLETED, FAILED, CANCELLED, REFUNDED]
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        200:
          description: Transaction history retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TraderTransaction"
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer

  /traders/transactions/stats:
    get:
      tags:
        - Trader API Management
      summary: Get trader transaction statistics
      security:
        - BearerAuth: []
      responses:
        200:
          description: Transaction statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/TraderTransactionStats"

  /traders/transactions/{transactionId}:
    get:
      tags:
        - Trader API Management
      summary: Get trader transaction by ID
      security:
        - BearerAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Transaction retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/TraderTransaction"
        404:
          description: Transaction not found

  /traders/dashboard:
    get:
      tags:
        - Trader API Management
      summary: Get trader dashboard statistics
      security:
        - BearerAuth: []
      responses:
        200:
          description: Dashboard statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/TraderDashboard"

  /traders/{traderId}/commission:
    patch:
      tags:
        - Trader API Management
      summary: Set trader wallet commission (Admin only)
      security:
        - BearerAuth: []
      parameters:
        - name: traderId
          in: path
          required: true
          schema:
            type: string
          description: Trader ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetCommissionRequest"
      responses:
        200:
          description: Commission updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/TraderWallet"
        400:
          description: Invalid commission value
        403:
          description: Admin access required

  /traders/commission/process-all:
    post:
      tags:
        - Trader API Management
      summary: Process all traders commission (Admin only)
      description: Process commission for all eligible vouchers that are SETTLED, MATURED, or EXPIRED
      security:
        - BearerAuth: []
      responses:
        200:
          description: All traders commission processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "All traders commission processed successfully"
                  data:
                    type: object
                    properties:
                      processedVouchers:
                        type: integer
                        description: Number of vouchers processed
                      results:
                        type: array
                        items:
                          type: object
                          properties:
                            traderId:
                              type: string
                            voucherId:
                              type: string
                            commissionAmount:
                              type: number
                              format: float
                            success:
                              type: boolean
        400:
          description: Processing failed
        403:
          description: Admin access required

  /traders/delegation/request:
    post:
      tags:
        - Trader API Management
      summary: Request delegation permission to trade on behalf
      security:
        - BearerAuth: []
      responses:
        200:
          description: Delegation request submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Delegation request submitted successfully"
        400:
          description: Bad request - Already has permission or request pending

  /traders/delegation/verify-otp:
    post:
      tags:
        - Trader API Management
      summary: Verify delegation OTP and complete approval
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sessionId
                - otp
                - commission
              properties:
                sessionId:
                  type: string
                  description: Session ID from approval request
                otp:
                  type: string
                  description: OTP code received by trader
                  example: "123456"
                commission:
                  type: number
                  format: float
                  description: Commission percentage
                  example: 5.0
      responses:
        200:
          description: Delegation approved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Delegation approved successfully"
        400:
          description: Bad request - Invalid OTP or session
        403:
          description: Admin access required

  /traders/delegation/{traderId}/revoke:
    delete:
      tags:
        - Trader API Management
      summary: Revoke trader delegation permission
      security:
        - BearerAuth: []
      parameters:
        - name: traderId
          in: path
          required: true
          schema:
            type: string
          description: Trader ID
      responses:
        200:
          description: Delegation revoked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Delegation revoked successfully"
        400:
          description: Bad request - Trader not found or no delegation
        403:
          description: Admin access required
  /traders/delegation/requests:
    get:
      tags:
        - Trader API Management
      summary: Get all delegation requests (Admin only)
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, APPROVED, ALL]
            default: ALL
          description: Filter by delegation status
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
          description: Items per page
      responses:
        200:
          description: Delegation requests retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        traderId:
                          type: string
                        traderInfo:
                          type: object
                          properties:
                            id:
                              type: string
                            username:
                              type: string
                            email:
                              type: string
                            phone:
                              type: string
                        delegationRequestedAt:
                          type: string
                          format: date-time
                          nullable: true
                        delegationApprovedAt:
                          type: string
                          format: date-time
                          nullable: true
                        delegationApprovedBy:
                          type: string
                          nullable: true
                        canTradeOnBehalf:
                          type: boolean
                        commission:
                          type: number
                          format: float
                        balance:
                          type: number
                          format: float
                        totalDeposited:
                          type: number
                          format: float
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
        403:
          description: Admin access required

  /traders/delegation/status:
    get:
      tags:
        - Trader API Management
      summary: Get trader's own delegation status
      security:
        - BearerAuth: []
      responses:
        200:
          description: Delegation status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      delegationRequestedAt:
                        type: string
                        format: date-time
                        nullable: true
                      delegationApprovedAt:
                        type: string
                        format: date-time
                        nullable: true
                      delegationApprovedBy:
                        type: string
                        nullable: true
                      canTradeOnBehalf:
                        type: boolean
                      commission:
                        type: number
                        format: float
                      status:
                        type: string
                        enum: [NOT_REQUESTED, PENDING, APPROVED]
        400:
          description: Trader wallet not found

  /traders/admin/{traderId}/approve-loan:
    post:
      tags:
        - Trader API Management
      summary: Admin approve loan on behalf of trader (Admin only)
      description: Allows admin to approve loans on behalf of traders who have delegation permission
      security:
        - BearerAuth: []
      parameters:
        - name: traderId
          in: path
          required: true
          schema:
            type: string
          description: Trader ID who will approve the loan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - loanId
                - approvedAmount
                - repaymentDays
              properties:
                loanId:
                  type: string
                  description: Loan application ID to approve
                  example: "uuid-loan-id"
                approvedAmount:
                  type: number
                  format: float
                  description: Approved loan amount
                  example: 50000
                repaymentDays:
                  type: number
                  description: Repayment period in days
                  example: 45
      responses:
        200:
          description: Loan approved successfully on behalf of trader
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Loan approved successfully on behalf of trader"
                  data:
                    type: object
                    description: Approved loan and voucher details
        400:
          description: Bad request - Missing required fields, trader has no delegation, insufficient balance, or invalid loan status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    examples:
                      missing_fields:
                        value: "loanId, approvedAmount, and repaymentDays are required"
                      no_delegation:
                        value: "Trader does not have delegation permission"
                      insufficient_balance:
                        value: "Insufficient available balance. Available: 10000 RWF, Required: 50000 RWF"
                      invalid_status:
                        value: "Can only approve loans with ACCEPTED or PENDING status"
        403:
          description: Admin access required

  /traders/delegation/reverse:
    post:
      tags:
        - Trader API Management
      summary: Reverse delegation status with OTP verification (Trader only)
      description: Allows trader to reverse their delegation status so they can continue approving vouchers/loans directly. Requires OTP verification for security.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - otp
              properties:
                otp:
                  type: string
                  description: OTP code for verification
                  example: "123456"
      responses:
        200:
          description: Delegation reversed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Delegation reversed successfully"
        400:
          description: Bad request - Invalid OTP, trader has no delegation, or phone number not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    examples:
                      invalid_otp:
                        value: "Invalid or expired OTP"
                      no_delegation:
                        value: "Trader does not have delegation permission to reverse"
                      phone_not_found:
                        value: "Trader phone number not found"
        403:
          description: Trader access required


  /traders/withdraw/request:
    post:
      tags:
        - Trader API Management
      summary: Request withdraw from balance or commission
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - withdrawType
                - paymentMethod
                - accountNumber
                - accountName
              properties:
                amount:
                  type: number
                  format: float
                  description: Amount to withdraw
                  example: 50000
                withdrawType:
                  type: string
                  enum: [BALANCE, COMMISSION]
                  description: Type of withdraw
                paymentMethod:
                  type: string
                  description: Payment method (MoMo, Card, Bank Transfer)
                  example: "Mobile Money"
                accountNumber:
                  type: string
                  description: Account number for payment
                  example: "0788123456"
                accountName:
                  type: string
                  description: Account holder name
                  example: "John Doe"
      responses:
        200:
          description: Withdraw request submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Withdraw request submitted successfully"
                  data:
                    type: object
        400:
          description: Bad request

  /traders/withdraw/{withdrawId}/approve:
    post:
      tags:
        - Trader API Management
      summary: Admin approve withdraw and send OTP (Admin only)
      security:
        - BearerAuth: []
      parameters:
        - name: withdrawId
          in: path
          required: true
          schema:
            type: string
          description: Withdraw request ID
      responses:
        200:
          description: OTP sent to trader
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "OTP sent to trader"
        400:
          description: Bad request
        403:
          description: Admin access required

  /traders/withdraw/verify-otp:
    post:
      tags:
        - Trader API Management
      summary: Verify withdraw OTP and complete withdrawal
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - withdrawId
                - otp
              properties:
                withdrawId:
                  type: string
                  description: Withdraw request ID
                otp:
                  type: string
                  description: OTP code
                  example: "123456"
      responses:
        200:
          description: Withdraw completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Withdraw completed successfully"
        400:
          description: Bad request - Invalid OTP or expired

  /traders/withdraw/requests:
    get:
      tags:
        - Trader API Management
      summary: Get trader's withdraw requests
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, PROCESSING, COMPLETED, FAILED]
      responses:
        200:
          description: Withdraw requests retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                  pagination:
                    type: object

  /traders/withdraw/all-requests:
    get:
      tags:
        - Trader API Management
      summary: Get all withdraw requests (Admin only)
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, PROCESSING, COMPLETED, FAILED]
      responses:
        200:
          description: All withdraw requests retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
