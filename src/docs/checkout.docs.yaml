tags:
  - name: Checkout API Management
    description: Advanced operations for checkout and payment processing with Mobile Money, Card, and Bank Transfer support

components:
  schemas:
    Checkout:
      type: object
      properties:
        id:
          type: string
          description: Unique checkout identifier
        cartId:
          type: string
          description: Cart ID associated with this checkout
        restaurantId:
          type: string
          description: Restaurant ID that owns this checkout
        totalAmount:
          type: number
          format: float
          description: Total amount for the checkout
        paymentMethod:
          type: string
          enum: [CASH, MOBILE_MONEY, BANK_TRANSFER, CARD]
          description: Selected payment method
        paymentStatus:
          type: string
          enum: [PENDING, PROCESSING, COMPLETED, FAILED, CANCELLED, REFUNDED]
          description: Current payment status

        # Billing Information
        billingName:
          type: string
          description: Billing name
        billingEmail:
          type: string
          description: Billing email
        billingPhone:
          type: string
          description: Billing phone number
        billingAddress:
          type: string
          description: Billing address

        # Delivery Information
        deliveryProvince:
          type: string
          description: Delivery province
        deliveryDistrict:
          type: string
          description: Delivery district
        deliverySector:
          type: string
          description: Delivery sector
        deliveryCell:
          type: string
          description: Delivery cell
        deliveryVillage:
          type: string
          description: Delivery village
        deliveryLocation:
          type: string
          description: Specific delivery location

        # Enhanced Payment Fields
        txRef:
          type: string
          description: Transaction reference
          example: "REST_123_CART_456_1704038400000"
        flwRef:
          type: string
          description: Transaction reference
        txOrderId:
          type: string
          description: Transaction order ID
        currency:
          type: string
          description: Currency code
          example: "RWF"
        clientIp:
          type: string
          description: Client IP address
          example: "192.168.1.1"
        deviceFingerprint:
          type: string
          description: Device fingerprint
        narration:
          type: string
          description: Payment narration

        # Bank transfer specific fields
        transferReference:
          type: string
          description: Bank transfer reference
        transferAccount:
          type: string
          description: Transfer account number
        transferBank:
          type: string
          description: Bank name for transfer
        accountExpiration:
          type: string
          format: date-time
          description: Account expiration time
        transferNote:
          type: string
          description: Transfer note
        transferAmount:
          type: number
          description: Transfer amount

        # Mobile money specific fields
        network:
          type: string
          description: Network provider (MTN, Airtel, etc.)
        voucher:
          type: string
          description: Voucher code
        paymentCode:
          type: string
          description: Payment code for USSD

        # Card payment specific fields
        cardNumber:
          type: string
          description: Last 4 digits of card number
        cardType:
          type: string
          description: Card type (Visa, MasterCard, etc.)
        cardCountry:
          type: string
          description: Card issuing country
        authModel:
          type: string
          description: Authorization model (PIN, NOAUTH, etc.)
        encryptionKey:
          type: string
          description: Encryption key for card payments

        # Authorization and redirect information
        redirectUrl:
          type: string
          description: Redirect URL for payment authorization
        authorizationMode:
          type: string
          description: Authorization mode
        validateInstructions:
          type: string
          description: Validation instructions

        # Transaction status and references
        transactionId:
          type: string
          description: Transaction ID
        paymentReference:
          type: string
          description: Payment reference
        processorResponse:
          type: string
          description: Processor response

        # Response fields
        flwStatus:
          type: string
          description: Status
        chargedAmount:
          type: number
          description: Charged amount
        appFee:
          type: number
          description: Application fee
        merchantFee:
          type: number
          description: Merchant fee

        # Additional metadata
        paymentPlan:
          type: string
          description: Payment plan
        fraudStatus:
          type: string
          description: Fraud status
        riskAction:
          type: string
          description: Risk action

        notes:
          type: string
          description: Special notes or instructions
        deliveryDate:
          type: string
          format: date-time
          description: Requested delivery date

        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        paidAt:
          type: string
          format: date-time
          description: When payment was completed

        # Relations
        cart:
          $ref: "#/components/schemas/CartWithItems"
        restaurant:
          $ref: "#/components/schemas/RestaurantInfo"
        order:
          $ref: "#/components/schemas/OrderInfo"

    CreateCheckoutRequest:
      type: object
      required:
        - cartId
        - paymentMethodId
      properties:
        cartId:
          type: string
          description: ID of the cart to checkout
        paymentMethodId:
          type: string
          description: Payment method configuration ID
        voucherCode:
          type: string
          description: Voucher code (required for VOUCHER payment method)
          example: "VCH-ABC123"
        promoCode:
          type: string
          description: Promo code for discount (optional)
          example: "SAVE20"
        fallbackPaymentMethod:
          type: string
          enum: [MOBILE_MONEY, BANK_TRANSFER, CARD]
          description: Fallback payment method for partial voucher payments
        billingName:
          type: string
          description: Billing name
        billingEmail:
          type: string
          format: email
          description: Billing email
        billingPhone:
          type: string
          description: Billing phone number
        billingAddress:
          type: string
          description: Billing address
        notes:
          type: string
          description: Special notes or instructions
        deliveryDate:
          type: string
          format: date-time
          description: Requested delivery date
        clientIp:
          type: string
          description: Client IP address
          example: "192.168.1.1"
        deviceFingerprint:
          type: string
          description: Device fingerprint
        narration:
          type: string
          description: Payment narration
        currency:
          type: string
          description: Currency code
          example: "RWF"
        cardDetails:
          $ref: "#/components/schemas/CardDetails"
        bankDetails:
          $ref: "#/components/schemas/BankDetails"
        otherServices:
          type: boolean
          description: Whether to include other services
          default: false

    CardDetails:
      type: object
      description: Card details (required for CARD payments)
      properties:
        cardNumber:
          type: string
          description: Card number
          example: "5531886652142950"
        cvv:
          type: string
          description: CVV code
          example: "564"
        expiryMonth:
          type: string
          description: Expiry month (MM)
          example: "09"
        expiryYear:
          type: string
          description: Expiry year (YYYY)
          example: "29"
        pin:
          type: string
          description: PIN (optional for some payments)
          example: "3310"

    BankDetails:
      type: object
      description: Bank details (optional for BANK_TRANSFER payments)
      properties:
        clientIp:
          type: string
          description: Client IP address
          example: "192.168.1.100"

    CreateAdminOrderRequest:
      type: object
      required:
        - restaurantId
        - products
        - paymentMethod
      properties:
        restaurantId:
          type: string
          description: ID of the restaurant for which to create the order
          example: "rest_123456789"
        products:
          type: array
          description: Array of products to include in the order
          items:
            type: object
            required:
              - productId
              - quantity
            properties:
              productId:
                type: string
                description: ID of the product
                example: "prod_123456789"
              quantity:
                type: integer
                minimum: 1
                description: Quantity of the product
                example: 2
        paymentMethod:
          type: string
          enum: [MOBILE_MONEY, CARD, BANK_TRANSFER, CASH, VOUCHER]
          description: Payment method for the order
          example: "VOUCHER"
        voucherCode:
          type: string
          description: Voucher code
          example: "VCH-ABC123"
        promoCode:
          type: string
          description: Promo code for discount (optional)
          example: "SAVE20"
        phoneNumber:
          type: string
          description: Phone number for payment processing (optional, uses restaurant phone if not provided)
          example: "250788123456"
        notes:
          type: string
          description: Optional notes for the order
          example: "Urgent delivery required"
        deliveryDate:
          type: string
          format: date-time
          description: Optional requested delivery date
          example: "2024-01-15T10:00:00Z"

    AdminOrderResponse:
      type: object
      properties:
        id:
          type: string
          example: "order_123456789"
        orderNumber:
          type: string
          example: "ORD-1704123456789"
        restaurantId:
          type: string
          example: "rest_123456789"
        totalAmount:
          type: number
          example: 25000
        deliveryFee:
          type: number
          example: 5000
        paymentMethod:
          type: string
          example: "VOUCHER"
        status:
          type: string
          example: "PENDING"
        paymentStatus:
          type: string
          example: "PENDING"
        restaurant:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            email:
              type: string
        orderItems:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
              quantity:
                type: integer
              unitPrice:
                type: number
              totalPrice:
                type: number
              product:
                type: object
                properties:
                  id:
                    type: string
                  productName:
                    type: string
                  unitPrice:
                    type: number

    ProcessPaymentRequest:
      type: object
      required:
        - paymentMethod
      properties:
        paymentMethod:
          type: string
          enum: [CASH, MOBILE_MONEY, BANK_TRANSFER, CARD]
          description: Payment method to process
        phoneNumber:
          type: string
          description: Phone number (required for MOBILE_MONEY)

        cardDetails:
          $ref: "#/components/schemas/CardDetails"
        bankDetails:
          $ref: "#/components/schemas/BankDetails"
        processDirectly:
          type: boolean
          description: Whether to process payment immediately
          default: true

    PaymentVerificationResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            verified:
              type: boolean
            status:
              type: string
            amount:
              type: number
            currency:
              type: string
            transactionId:
              type: string
            flwRef:
              type: string
            txRef:
              type: string

    PaymentResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            checkout:
              $ref: "#/components/schemas/Checkout"
            transactionId:
              type: string
            redirectUrl:
              type: string
              description: URL for payment authorization redirect
            transferDetails:
              type: object
              description: Bank transfer details
              properties:
                transferReference:
                  type: string
                transferAccount:
                  type: string
                transferBank:
                  type: string
                transferAmount:
                  type: number
                transferNote:
                  type: string
                accountExpiration:
                  type: string
                  format: date-time
            status:
              type: string
            requiresRedirect:
              type: boolean
              description: Whether payment requires redirect

    CartWithItems:
      type: object
      properties:
        id:
          type: string
        totalAmount:
          type: number
          format: float
        status:
          type: string
        cartItems:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"

    OrderInfo:
      type: object
      properties:
        id:
          type: string
        orderNumber:
          type: string
        status:
          type: string

    CheckoutPaginationResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/Checkout"
        pagination:
          $ref: "#/components/schemas/PaginationInfo"

    PaginationInfo:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    ApiResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: object

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        error:
          type: string

    VoucherValidationRequest:
      type: object
      required:
        - voucherCode
        - orderAmount
      properties:
        voucherCode:
          type: string
          description: Voucher code to validate
          example: "VCH-ABC123"
        orderAmount:
          type: number
          description: Order amount to validate against
          example: 50000

    VoucherOTPResponse:
      type: object
      properties:
        message:
          type: string
          example: "OTP sent to your registered phone number. Please verify to complete voucher payment."
        requiresOTP:
          type: boolean
          example: true
        checkoutSessionId:
          type: string
          description: Base64 encoded checkout session data for OTP verification
          example: "eyJjYXJ0SWQiOiJjYXJ0MTIzIiwicGF5bWVudE1ldGhvZCI6IlZPVUNIRVIifQ=="

    VoucherOTPVerificationRequest:
      type: object
      required:
        - otp
        - checkoutSessionId
      properties:
        otp:
          type: string
          pattern: "^[0-9]{5}$"
          description: 5-digit OTP received via SMS
          example: "12345"
        checkoutSessionId:
          type: string
          description: Session ID received from initial checkout request
          example: "eyJjYXJ0SWQiOiJjYXJ0MTIzIiwicGF5bWVudE1ldGhvZCI6IlZPVUNIRVIifQ=="

    VoucherValidationResponse:
      type: object
      properties:
        message:
          type: string
        valid:
          type: boolean
        data:
          type: object
          properties:
            voucher:
              type: object
              properties:
                id:
                  type: string
                code:
                  type: string
                discountPercentage:
                  type: number
                remainingCredit:
                  type: number
                loanId:
                  type: string
            coverage:
              type: object
              properties:
                orderAmount:
                  type: number
                discountAmount:
                  type: number
                amountAfterDiscount:
                  type: number
                serviceFee:
                  type: number
                totalRequired:
                  type: number
                voucherCovers:
                  type: number
                coversFullAmount:
                  type: boolean
                requiresAdditionalPayment:
                  type: boolean
                additionalPaymentRequired:
                  type: number
            warning:
              type: string
              nullable: true

    VoucherPaymentResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            checkout:
              $ref: "#/components/schemas/Checkout"
            transactionId:
              type: string
            status:
              type: string
            voucherApplied:
              type: boolean
            voucherDetails:
              type: object
              properties:
                voucherCode:
                  type: string
                discountPercentage:
                  type: number
                amountCovered:
                  type: number
                remainingAmount:
                  type: number
                creditUsed:
                  type: number
                remainingCredit:
                  type: number
            creditRemaining:
              type: number
            paymentDeadline:
              type: string
              format: date-time
              nullable: true
            paymentDeadlineMessage:
              type: string
              nullable: true
            requiresAdditionalPayment:
              type: boolean
            additionalPaymentAmount:
              type: number
            redirectUrl:
              type: string
              description: For additional payment redirect if needed

paths:
  /checkouts:
    post:
      tags:
        - Checkout API Management
      summary: Create a new checkout integration
      description: Create a new checkout from an active cart with enhanced payment fields
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckoutRequest"
            examples:
              mobile_money:
                summary: Mobile Money Payment
                value:
                  cartId: "cart123"
                  paymentMethodId: "pm_mobile_money_123"
                  promoCode: "SAVE20"
                  billingPhone: "250788123456"
                  billingAddress: "123 Main St"
                  notes: "Special instructions"
                  deliveryDate: "2023-06-30"
                  otherServices: false
              cash_payment:
                summary: Cash Payment
                value:
                  cartId: "cart123"
                  paymentMethodId: "pm_cash_123"
                  billingAddress: "123 Main St"
                  notes: "Special instructions"
                  deliveryDate: "2023-06-30"
                  otherServices: false
              card_payment:
                summary: Card Payment
                value:
                  cartId: "cart123"
                  paymentMethodId: "pm_card_123"
                  promoCode: "SAVE20"
                  billingEmail: "foodbundles@example.com"
                  billingName: "John Doe"
                  billingPhone: "250788123456"
                  billingAddress: "123 Main St"
                  cardDetails:
                    cardNumber: "5531886652142950"
                    cvv: "564"
                    expiryMonth: "09"
                    expiryYear: "29"
                    pin: "3310"
                  notes: "Special instructions"
                  deliveryDate: "2023-06-30"
                  currency: "RWF"
                  otherServices: false
              bank_transfer:
                summary: Bank Transfer
                value:
                  cartId: "cart123"
                  paymentMethodId: "pm_bank_transfer_123"
                  billingEmail: "foodbundles@example.com"
                  billingPhone: "250788123456"
                  billingAddress: "123 Main St"
                  notes: "Special instructions"
                  deliveryDate: "2023-06-30"
                  currency: "RWF"
                  bankDetails:
                    clientIp: "192.168.1.100"
                  deviceFingerprint: "62wd23423rq324323qew1"
                  narration: "Payment for order 123"
                  otherServices: false
              voucher_payment:
                summary: Voucher Payment (Requires OTP)
                value:
                  cartId: "cart123"
                  paymentMethodId: "pm_voucher_123"
                  voucherCode: "VCH-100DISC"
                  promoCode: "SAVE20"
                  billingPhone: "250788123456"
                  billingAddress: "123 Main St"
                  notes: "Using voucher - OTP will be sent"
                  otherServices: false

      responses:
        200:
          description: Checkout initiated successfully
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/VoucherOTPResponse"
                  - $ref: "#/components/schemas/PaymentResponse"
              examples:
                voucher_otp_sent:
                  summary: OTP sent for voucher payment
                  value:
                    message: "OTP sent to your registered phone number. Please verify to complete voucher payment."
                    requiresOTP: true
                    checkoutSessionId: "eyJjYXJ0SWQiOiJjYXJ0MTIzIiwicGF5bWVudE1ldGhvZCI6IlZPVUNIRVIifQ=="
                non_voucher_payment:
                  summary: Non-voucher payment processed
                  value:
                    message: "Payment processed successfully"
                    data:
                      checkout:
                        id: "checkout123"
                        totalAmount: 50000
                        paymentStatus: "COMPLETED"
                      transactionId: "txn_123"
                      status: "successful"
        400:
          description: Bad request - Invalid input or cart issues
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                voucher_required:
                  value:
                    message: "Voucher code is required for voucher payments"
                otp_send_failed:
                  value:
                    message: "Failed to send OTP. Please try again."
                missing_fields:
                  value:
                    message: "Cart ID and payment method ID are required"
                invalid_payment_method:
                  value:
                    message: "Invalid payment method"
                empty_cart:
                  value:
                    message: "Cart is empty"
                insufficient_stock:
                  value:
                    message: "Insufficient stock for Product Name. Available: 5, Required: 10"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        403:
          description: Forbidden - Restaurant access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      tags:
        - Checkout API Management
      summary: Get all checkouts with enhanced fields (Admin only)
      description: Retrieve all checkouts integration details and filtering
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number for pagination
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
          description: Number of checkouts per page
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, PROCESSING, COMPLETED, FAILED, CANCELLED, REFUNDED]
          description: Filter by payment status
        - name: paymentMethod
          in: query
          schema:
            type: string
            enum: [CASH, MOBILE_MONEY, BANK_TRANSFER, CARD]
          description: Filter by payment method
      responses:
        200:
          description: Checkouts retrieved successfully with enhanced fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutPaginationResponse"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        403:
          description: Forbidden - Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /checkouts/admin-order:
    post:
      tags:
        - Checkout API Management
      summary: Create order on behalf of restaurant
      description: Create order on behalf of restaurant by ADMIN/LOGISTICS
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminOrderRequest"
            examples:
              mobile_money_payment:
                summary: Order with mobile money payment
                value:
                  restaurantId: "rest_123456789"
                  products:
                    - productId: "prod_123456789"
                      quantity: 2
                  paymentMethod: "MOBILE_MONEY"
                  phoneNumber: "250788123456"
                  notes: "Mobile money payment order"
                  deliveryDate: "2024-01-15T10:00:00Z"
              card_payment:
                summary: Order with card payment
                value:
                  restaurantId: "rest_123456789"
                  products:
                    - productId: "prod_123456789"
                      quantity: 1
                  paymentMethod: "CARD"
                  notes: "Card payment order"
              bank_transfer_payment:
                summary: Order with bank transfer payment
                value:
                  restaurantId: "rest_123456789"
                  products:
                    - productId: "prod_123456789"
                      quantity: 2
                  paymentMethod: "BANK_TRANSFER"
                  notes: "Bank transfer payment order"
              cash_payment:
                summary: Order with cash payment
                value:
                  restaurantId: "rest_123456789"
                  products:
                    - productId: "prod_123456789"
                      quantity: 3
                  paymentMethod: "CASH"
                  notes: "Cash payment order"
              voucher_payment:
                summary: Order with voucher payment
                value:
                  restaurantId: "rest_123456789"
                  products:
                    - productId: "prod_123456789"
                      quantity: 2
                    - productId: "prod_987654321"
                      quantity: 1
                  paymentMethod: "VOUCHER"
                  voucherCode: "VCH-ABC123"
                  promoCode: "SAVE20"
                  notes: "Admin created order with voucher and promo"
                  deliveryDate: "2024-01-15T10:00:00Z"
      responses:
        201:
          description: Order created successfully
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
                        properties:
                          checkout:
                            $ref: "#/components/schemas/Checkout"
                          transactionId:
                            type: string
                          status:
                            type: string
                  - type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
                        properties:
                          checkout:
                            $ref: "#/components/schemas/Checkout"
                          transactionId:
                            type: string
                          redirectUrl:
                            type: string
                          status:
                            type: string
                          requiresRedirect:
                            type: boolean
                  - type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
                        properties:
                          checkout:
                            $ref: "#/components/schemas/Checkout"
                          transactionId:
                            type: string
                          transferDetails:
                            type: object
                          status:
                            type: string
              examples:
                successful_payment:
                  summary: Order created with successful payment
                  value:
                    message: "Order created and payment processed successfully"
                    data:
                      checkout:
                        id: "order_123456789"
                        totalAmount: 25000
                        paymentStatus: "COMPLETED"
                      transactionId: "txn_123456789"
                      status: "successful"
                redirect_required:
                  summary: Order created with redirect required
                  value:
                    message: "Order created - redirect required for payment"
                    data:
                      checkout:
                        id: "order_123456789"
                        totalAmount: 25000
                        paymentStatus: "PROCESSING"
                      transactionId: "txn_123456789"
                      redirectUrl: "https://payment.provider.com/auth"
                      status: "pending"
                      requiresRedirect: true
                bank_transfer:
                  summary: Order created with bank transfer
                  value:
                    message: "Order created - bank transfer initiated"
                    data:
                      checkout:
                        id: "order_123456789"
                        totalAmount: 25000
                        paymentStatus: "PROCESSING"
                      transactionId: "txn_123456789"
                      transferDetails:
                        transferReference: "FLW-MOCK-72c3b8b4e8c4a0e5f7d2b1a9"
                        transferAccount: "0123456789"
                        transferBank: "Test Bank"
                        transferAmount: 25000
                      status: "pending"
        400:
          description: Bad request - validation errors or payment failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing_fields:
                  value:
                    message: "Restaurant ID, products array, and payment method are required"
                invalid_products:
                  value:
                    message: "Each product must have productId and quantity > 0"
                voucher_required:
                  value:
                    message: "Voucher ID or voucher code is required for voucher payments"
                product_not_found:
                  value:
                    message: "Product prod_123 not found"
                product_unavailable:
                  value:
                    message: "Product Sample Product is not available"
                payment_failed:
                  value:
                    message: "Order creation failed"
                    error: "Payment processing failed: Insufficient balance"
        403:
          description: Access denied - insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "Access denied. Only ADMIN or LOGISTICS can create orders on behalf of restaurants"
        404:
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                restaurant_not_found:
                  value:
                    message: "Restaurant not found"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                server_error:
                  value:
                    message: "Failed to create admin order"
                    error: "Database connection error"
                payment_error:
                  value:
                    message: "Payment processing failed: Database connection issue. Please try again."
                    error: "Database connection issue. Please try again."

  /checkouts/{orderId}/payment:
    post:
      tags:
        - Checkout API Management
      summary: Process payment for checkout integration
      description: Process payment using various methods (Cash, Mobile Money, Bank Transfer, Card) integration
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
          description: Unique checkout identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessPaymentRequest"
            examples:
              mobile_money:
                summary: Mobile Money Payment
                value:
                  paymentMethod: "MOBILE_MONEY"
                  phoneNumber: "250788123456"
                  processDirectly: true
              cash_payment:
                summary: Cash Payment
                value:
                  paymentMethod: "CASH"
                  processDirectly: true
              card_payment:
                summary: Card Payment
                value:
                  paymentMethod: "CARD"
                  cardDetails:
                    cardNumber: "5531886652142950"
                    cvv: "564"
                    expiryMonth: "09"
                    expiryYear: "29"
                    pin: "3310"
                  processDirectly: true
              bank_transfer:
                summary: Bank Transfer
                value:
                  paymentMethod: "BANK_TRANSFER"
                  bankDetails:
                    clientIp: "192.168.1.100"
                  processDirectly: true
      responses:
        200:
          description: Payment processed successfully integration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        400:
          description: Bad request - Invalid payment data or payment failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing_payment_method:
                  value:
                    message: "Payment method is required"
                missing_phone:
                  value:
                    message: "Phone number is required for mobile money payments"
                invalid_phone:
                  value:
                    message: "Invalid mobile number. Please use format: 078XXXXXXX, 079XXXXXXX, 072XXXXXXX, or 073XXXXXXX"
                missing_card_details:
                  value:
                    message: "Complete card details (number, CVV, expiry month/year) are required"
                payment_failed:
                  value:
                    message: "Payment failed"
                    error: "Insufficient balance"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        404:
          description: Checkout not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /checkouts/{orderId}/verify-payment:
    get:
      tags:
        - Checkout API Management
      summary: Verify payment status
      description: Verify the status of a payment transaction
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
          description: Unique checkout identifier
        - name: transactionId
          in: query
          required: true
          schema:
            type: string
          description: Transaction ID to verify
      responses:
        200:
          description: Payment verification completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentVerificationResponse"
        400:
          description: Bad request - Missing transaction ID or verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "Transaction ID is required for verification"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        404:
          description: Checkout not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /checkouts/validate-voucher:
    post:
      tags:
        - Checkout API Management
      summary: Validate voucher for checkout
      description: Validate if a voucher can be used for a specific order amount
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoucherValidationRequest"
            example:
              voucherCode: "VCH-ABC123"
              orderAmount: 50000
      responses:
        200:
          description: Voucher validation completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoucherValidationResponse"
              examples:
                valid_full_coverage:
                  summary: Valid voucher with full coverage
                  value:
                    message: "Voucher validated successfully"
                    valid: true
                    data:
                      voucher:
                        id: "voucher123"
                        code: "VCH-ABC123"
                        discountPercentage: 100
                        remainingCredit: 60000
                        loanId: "loan123"
                      coverage:
                        orderAmount: 50000
                        discountAmount: 50000
                        amountAfterDiscount: 0
                        serviceFee: 0
                        totalRequired: 0
                        voucherCovers: 0
                        coversFullAmount: true
                        requiresAdditionalPayment: false
                        additionalPaymentRequired: 0
                      warning: null
                valid_partial_coverage:
                  summary: Valid voucher requiring additional payment
                  value:
                    message: "Voucher validated successfully"
                    valid: true
                    data:
                      voucher:
                        id: "voucher123"
                        code: "VCH-20PERCENT"
                        discountPercentage: 20
                        remainingCredit: 30000
                        loanId: "loan123"
                      coverage:
                        orderAmount: 100000
                        discountAmount: 20000
                        amountAfterDiscount: 80000
                        serviceFee: 8000
                        totalRequired: 88000
                        voucherCovers: 30000
                        coversFullAmount: false
                        requiresAdditionalPayment: true
                        additionalPaymentRequired: 58000
                      warning: "Voucher will cover 30000 RWF. Additional payment of 58000 required."
        400:
          description: Invalid voucher or validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  valid:
                    type: boolean
              examples:
                already_used:
                  value:
                    message: "Voucher has already been used"
                    valid: false
                insufficient_credit:
                  value:
                    message: "Voucher has no remaining credit"
                    valid: false
                expired:
                  value:
                    message: "Voucher has expired"
                    valid: false

  /checkouts/verify-voucher-otp:
    post:
      tags:
        - Checkout API Management
      summary: Verify OTP and complete voucher payment
      description: |
        Verify the OTP sent to restaurant's phone and complete the voucher payment process.
        This endpoint should be called after receiving OTP from the initial checkout request.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoucherOTPVerificationRequest"
            example:
              otp: "12345"
              checkoutSessionId: "eyJjYXJ0SWQiOiJjYXJ0MTIzIiwicGF5bWVudE1ldGhvZCI6IlZPVUNIRVIifQ=="
      responses:
        200:
          description: OTP verified and voucher payment processed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoucherPaymentResponse"
              examples:
                full_voucher_payment:
                  summary: Full payment with voucher
                  value:
                    message: "Payment completed using voucher"
                    data:
                      checkout:
                        id: "checkout123"
                        totalAmount: 50000
                        paymentStatus: "COMPLETED"
                      transactionId: "vtxn_123"
                      status: "successful"
                      voucherApplied: true
                      voucherDetails:
                        voucherCode: "VCH-100DISC"
                        discountPercentage: 100
                        amountCovered: 0
                        remainingAmount: 0
                        creditUsed: 0
                        remainingCredit: 50000
                      creditRemaining: 50000
                      paymentDeadline: "2029-12-30T00:00:00Z"
                partial_voucher_payment:
                  summary: Partial voucher with additional payment required
                  value:
                    message: "Voucher applied. Additional payment required."
                    data:
                      checkout:
                        id: "checkout123"
                        totalAmount: 100000
                        paymentStatus: "PROCESSING"
                      transactionId: "combined_txn_123"
                      status: "pending"
                      voucherApplied: true
                      voucherDetails:
                        voucherCode: "VCH-20PERCENT"
                        discountPercentage: 20
                        amountCovered: 30000
                        remainingAmount: 58000
                        creditUsed: 30000
                        remainingCredit: 0
                      requiresAdditionalPayment: true
                      additionalPaymentAmount: 58000
                      redirectUrl: "https://payment.provider.com/auth"
        400:
          description: Bad request - Invalid OTP or session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid_otp:
                  value:
                    message: "Invalid or expired OTP"
                invalid_session:
                  value:
                    message: "Invalid checkout session"
                missing_fields:
                  value:
                    message: "OTP and checkout session ID are required"
                voucher_payment_failed:
                  value:
                    message: "Voucher payment failed"
                    error: "Insufficient voucher credit"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        403:
          description: Forbidden - Restaurant access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
